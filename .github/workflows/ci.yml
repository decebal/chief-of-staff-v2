name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The kit's state helper and release preflight run inside `cargo test`
      # (tests/state.rs, tests/kit.rs), which fail under CI without Python 3.10+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Demo home builds and renders
        run: cargo run --example demo -- "$RUNNER_TEMP/cos-demo"
