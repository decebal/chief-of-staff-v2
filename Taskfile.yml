version: "3"

vars:
  AGENTS: [tactician]
  LAUNCHD: "{{.HOME}}/Library/LaunchAgents"
  LAUNCHCTL: launchctl
  COS: cos
  BIN: "{{.HOME}}/.cargo/bin/cos"
  # Apps started from the Dock hand MCP servers a minimal PATH; cos needs
  # claude, gh and cn on it.
  TOOL_PATH: "{{.HOME}}/.cargo/bin:{{.HOME}}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
  DESKTOP_CONFIG: "{{.HOME}}/Library/Application Support/Claude/claude_desktop_config.json"

tasks:
  setup:
    desc: First run — seed context/ and an empty .chief-of-staff/ workspace (never overwrites), then install
    cmds:
      - mkdir -p context/decisions
      - cp -Rn templates/context/ context/ || true
      - task: install
      - test -d .chief-of-staff || {{.BIN}} --home {{.ROOT_DIR}} state init
      - echo "Next - set up goals and approved sources with the starter skill (START-HERE.md), then run 'cos brief'."

  build:
    desc: Release build of cos
    cmds:
      - timeout 300 cargo build --release

  test:
    desc: fmt, clippy, tests
    cmds:
      - timeout 300 cargo fmt --check
      - timeout 300 cargo clippy --all-targets -- -D warnings
      - timeout 300 cargo test

  install:
    desc: cos → ~/.cargo/bin; agents → ~/.claude/agents (for interactive Claude Code)
    deps: [build]
    cmds:
      # Copy-then-rename: overwriting the file in place (while Claude Desktop or
      # Codex run `cos mcp`) leaves macOS a stale code-signature for it, and
      # every later exec is SIGKILLed.
      - cp target/release/cos {{.BIN}}.new
      - mv -f {{.BIN}}.new {{.BIN}}
      - mkdir -p ~/.claude/agents
      # Agents this repo no longer ships; left installed, they delegate to a
      # brain that is gone.
      - rm -f ~/.claude/agents/chief-of-staff.md ~/.claude/agents/strategist.md
      - for: { var: AGENTS }
        cmd: sed "s|@COS_HOME@|{{.ROOT_DIR}}|g" .claude/agents/{{.ITEM}}.md > ~/.claude/agents/{{.ITEM}}.md

  install-mcp:
    desc: Register `cos mcp` with Claude Desktop and Codex (backs up the Desktop config)
    deps: [install]
    cmds:
      - task: install-mcp-desktop
      - task: install-mcp-codex

  install-mcp-desktop:
    status:
      - test ! -d "$(dirname "{{.DESKTOP_CONFIG}}")"
    cmds:
      - test -f "{{.DESKTOP_CONFIG}}" || echo '{}' > "{{.DESKTOP_CONFIG}}"
      - cp "{{.DESKTOP_CONFIG}}" "{{.DESKTOP_CONFIG}}.bak"
      - >-
        jq --arg bin "{{.BIN}}" --arg path "{{.TOOL_PATH}}"
        '.mcpServers.cos = {command: $bin, args: ["mcp"], env: {PATH: $path}}'
        "{{.DESKTOP_CONFIG}}.bak" > "{{.DESKTOP_CONFIG}}"
      - echo "Claude Desktop - restart it to load cos."

  install-mcp-codex:
    status:
      - "! command -v codex"
    cmds:
      - codex mcp remove cos >/dev/null 2>&1 || true
      - codex mcp add cos --env PATH="{{.TOOL_PATH}}" -- {{.BIN}} mcp
      - >-
        echo "Codex - the paid tools (brief, ask) can outlast Codex's 60s tool timeout;
        add tool_timeout_sec = 320 under [mcp_servers.cos] in ~/.codex/config.toml."

  kit:
    desc: Package the starter kit (allowlisted files only, per-file SHA256) to a new ZIP outside the repo
    preconditions:
      - sh: test -n "{{.OUT}}"
        msg: "task kit OUT=/absolute/path/chief-of-staff-starter.zip"
    cmds:
      - timeout 120 python3 -B scripts/release.py --output "{{.OUT}}"

  desktop:
    desc: The desktop app (report + agent launcher); builds cos first so it can supervise agents
    cmds:
      # One after the other: the desktop build would otherwise race this one.
      - timeout 300 cargo build --bin cos
      - timeout 300 cargo build -p cos-desktop
      # The cap is for builds; a running app under it is killed after 5 minutes.
      - target/debug/cos-desktop

  desktop-app:
    desc: Build the desktop app (debug, the warm cache) and install ~/Applications/Chief of Staff.app, ad-hoc signed
    vars:
      APP: "{{.HOME}}/Applications/Chief of Staff.app"
      STAGE: "{{.ROOT_DIR}}/target/bundle/Chief of Staff.app"
    cmds:
      # One after the other: two cargo builds at once fight over the lock.
      - timeout 300 cargo build --bin cos
      - timeout 300 cargo build -p cos-desktop
      - rm -rf "{{.STAGE}}"
      - mkdir -p "{{.STAGE}}/Contents/MacOS" "{{.STAGE}}/Contents/Resources"
      - cp apps/desktop/bundle/Info.plist "{{.STAGE}}/Contents/Info.plist"
      - cp apps/desktop/icons/icon.icns "{{.STAGE}}/Contents/Resources/icon.icns"
      - cp target/debug/cos-desktop "{{.STAGE}}/Contents/MacOS/cos-desktop"
      # The app supervises agents with the `cos` beside it (Settings::cos_binary).
      - cp target/debug/cos "{{.STAGE}}/Contents/MacOS/cos"
      - codesign --force --deep --sign - "{{.STAGE}}"
      - mkdir -p "{{.HOME}}/Applications"
      # Copy-then-rename, as in `install`: a running app keeps its old inode
      # and macOS never sees a half-written, stale-signed bundle.
      - rm -rf "{{.APP}}.new"
      - cp -R "{{.STAGE}}" "{{.APP}}.new"
      - rm -rf "{{.APP}}"
      - mv "{{.APP}}.new" "{{.APP}}"
      - codesign --verify --deep --strict "{{.APP}}"
      - echo "installed {{.APP}}"

  desktop-check:
    desc: fmt, clippy and build of the desktop crate
    cmds:
      - timeout 300 cargo fmt -p cos-desktop --check
      - timeout 300 cargo clippy -p cos-desktop -- -D warnings

  dash:
    desc: Live dashboard on http://127.0.0.1:8790; an open tab reloads after every run
    cmds:
      - "{{.BIN}} dash"

  demo:
    desc: Synthetic COS_HOME (fictional person, repos, people) at /tmp/cos-demo; touches no account
    cmds:
      - rm -rf /tmp/cos-demo
      - cargo run --quiet --example demo -- /tmp/cos-demo

  screenshots:
    desc: Re-take docs/assets/*.png from the demo dashboard (macOS, Google Chrome), in UTC
    env:
      TZ: UTC
    vars:
      CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      # Reduced motion: virtual time does not advance CSS entrances, so a capture would catch the cards mid-fade.
      SHOT: '"{{.CHROME}}" --headless=new --disable-gpu --hide-scrollbars --log-level=3 --virtual-time-budget=4000 --force-device-scale-factor=2 --force-prefers-reduced-motion --blink-settings=preferredColorScheme=1'
      GUIDE: api-gateway%3Adocs%2Fguides%2Frequest-log-migration.md
      MAP: api-gateway%3Adocs%2FREADME.md
    cmds:
      # One after the other: `deps` would run two cargo builds at once.
      - task: build
      - task: demo
      - mkdir -p docs/assets
      - defer: pkill -f "cos --home /tmp/cos-demo --projects /tmp/cos-demo/projects --no-open dash --port 8792" || true
      - (COS_CN=/tmp/cos-demo/bin/cn target/release/cos --home /tmp/cos-demo --projects /tmp/cos-demo/projects --no-open dash --port 8792 &) ; sleep 1
      - '{{.SHOT}} --window-size=1280,1500 --screenshot=docs/assets/today.png http://127.0.0.1:8792/'
      - '{{.SHOT}} --window-size=1280,1500 --force-dark-mode --blink-settings=preferredColorScheme=0 --screenshot=docs/assets/today-dark.png http://127.0.0.1:8792/'
      # Tab views start at the sub-nav under the hero: capture tall, then crop (offset in device pixels).
      - '{{.SHOT}} --window-size=1280,2700 --screenshot=/tmp/cos-shot.png "http://127.0.0.1:8792/#plan"'
      - sips --cropOffset 536 0 -c 2700 2560 /tmp/cos-shot.png --out docs/assets/plan.png
      - '{{.SHOT}} --window-size=1280,2700 --screenshot=/tmp/cos-shot.png "http://127.0.0.1:8792/#right"'
      - sips --cropOffset 536 0 -c 2700 2560 /tmp/cos-shot.png --out docs/assets/quarter.png
      - '{{.SHOT}} --window-size=1280,2700 --screenshot=/tmp/cos-shot.png "http://127.0.0.1:8792/#history"'
      - sips --cropOffset 536 0 -c 3000 2560 /tmp/cos-shot.png --out docs/assets/history.png
      # The docs room over the demo checkouts: every bet, a topic with one node selected, the reader beside the graph and full screen.
      - '{{.SHOT}} --window-size=1440,900 --screenshot=docs/assets/docs-bets.png http://127.0.0.1:8792/docs'
      - '{{.SHOT}} --window-size=1440,900 --screenshot=docs/assets/docs-topic.png "http://127.0.0.1:8792/docs#select={{.GUIDE}}"'
      - '{{.SHOT}} --window-size=1440,900 --screenshot=docs/assets/docs-reader.png "http://127.0.0.1:8792/docs#doc={{.MAP}}&mode=wide"'
      - '{{.SHOT}} --window-size=1440,900 --screenshot=docs/assets/docs-focus.png "http://127.0.0.1:8792/docs#doc={{.GUIDE}}&mode=focus"'
      # Every ritual flow over the demo's fictional Chronis stores, through its stand-in cn.
      - '{{.SHOT}} --window-size=1280,1100 --screenshot=docs/assets/flows.png http://127.0.0.1:8792/flows'

  tunnel:
    desc: Read-only MCP behind a Cloudflare quick tunnel for claude.ai; prints the connector URL
    preconditions:
      - sh: command -v cloudflared
        msg: "cloudflared is missing - brew install cloudflared"
    cmds:
      - "{{.BIN}} tunnel"

  rotate-token:
    desc: Invalidate the connector URL; the next tunnel run mints a new token
    cmds:
      - rm -f out/.mcp-token

  schedule:
    desc: Load the launchd jobs for BUSINESS=<name> (default the active business); weekday 08:30 brief, the dashboard kept running
    vars:
      # Task-scoped: a global var would run cos (and its first-run registry write) on every task call.
      # Name on the `current:` line of `cos business list`; `explicit` when COS_HOME or a directory flag sets the triple.
      ACTIVE:
        sh: '{{.COS}} business list | sed -n "s/^current: \([^ ]*\) .*/\1/p"'
      BUSINESS: '{{.BUSINESS | default .ACTIVE}}'
      # Empty on failure: the precondition and the first step below stop the task with the reason.
      HOME_DIR:
        sh: '{{.COS}} --business {{.BUSINESS}} business home || true'
      # Same lookup as `business::location`: launchd jobs get no XDG_CONFIG_HOME, so the plist pins the file.
      REGISTRY:
        sh: 'echo "${COS_BUSINESSES:-${XDG_CONFIG_HOME:-$HOME/.config}/cos/businesses.toml}"'
    preconditions:
      - sh: 'case "{{.BUSINESS}}" in ""|explicit) false ;; *) true ;; esac'
        msg: "name the business: task schedule BUSINESS=<name>"
    cmds:
      - '{{.COS}} --business {{.BUSINESS}} business home'
      - mkdir -p "{{.HOME_DIR}}/out/logs"
      - task: unload-retired
      # Both render before either replaces a live plist: a failed sed (a `|` in a path) leaves the loaded jobs and their files as they were.
      - for: [brief, dash]
        cmd: >-
          sed -e "s|@HOME@|$HOME|g" -e "s|@BUSINESS@|{{.BUSINESS}}|g" -e "s|@HOME_DIR@|{{.HOME_DIR}}|g"
          -e "s|@REGISTRY@|{{.REGISTRY}}|g"
          launchd/cos.{{.ITEM}}.plist > "{{.LAUNCHD}}/cos.{{.ITEM}}.plist.new"
      - for: [brief, dash]
        cmd: 'mv -f "{{.LAUNCHD}}/cos.{{.ITEM}}.plist.new" "{{.LAUNCHD}}/cos.{{.ITEM}}.plist"'
      # A loaded label refuses bootstrap; booting out first is what lets a reschedule move the jobs.
      - for: [brief, dash]
        cmd: "{{.LAUNCHCTL}} bootout gui/$(id -u)/cos.{{.ITEM}} 2>/dev/null || true"
      - for: [brief, dash]
        cmd: '{{.LAUNCHCTL}} bootstrap gui/$(id -u) "{{.LAUNCHD}}/cos.{{.ITEM}}.plist"'

  unschedule:
    desc: Unload the launchd jobs
    cmds:
      - task: unload-retired
      - for: [brief, dash]
        cmd: "{{.LAUNCHCTL}} bootout gui/$(id -u)/cos.{{.ITEM}} || true"
      # launchd loads every plist in LaunchAgents at login, so a left file reschedules the job.
      - for: [brief, dash]
        cmd: 'rm -f "{{.LAUNCHD}}/cos.{{.ITEM}}.plist"'

  unload-retired:
    internal: true
    desc: Unload the Friday `cos review` job an earlier schedule loaded; the subcommand no longer exists
    cmds:
      - "{{.LAUNCHCTL}} bootout gui/$(id -u)/cos.review 2>/dev/null || true"
      - rm -f "{{.LAUNCHD}}/cos.review.plist"
