[package]
name = "cos-desktop"
version = "0.1.0"
edition = "2024"
description = "Chief of Staff desktop: the cos dashboard and an agent launcher in one window"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "cos_desktop"
path = "src/lib.rs"

[[bin]]
name = "cos-desktop"
path = "src/main.rs"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
cos = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
