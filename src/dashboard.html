<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chief of staff</title>
<style>
/*__COS_TOKENS__*/
  * { box-sizing: border-box; }  body { margin: 0; }
  .wrap { padding: 1rem 1.125rem 1.125rem; }
  .top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .top > svg { width: var(--icon-md); height: var(--icon-md); flex: none; }
  .tabs { display: flex; gap: 0.25rem; margin-right: auto; }
  button { font-family: var(--font-sans); font-size: var(--text-sm); padding: 0.3125rem 0.6875rem; border-radius: var(--radius-md); cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--foreground); }
  button:hover { background: var(--accent); }
  button[aria-pressed="true"] { background: var(--secondary); font-weight: var(--font-weight-semibold); }
  button.run { border-color: var(--primary); color: var(--brand-text); }
  button.run.armed { background: var(--primary); color: var(--primary-foreground); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  h2 { font-size: var(--text-base); line-height: var(--text-base--line-height); margin: 0 0 0.25rem; }
  .day { color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--text-xs); margin-bottom: 0.625rem; }
  .headline { margin: 0 0 0.875rem; }
  h3 { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--muted-foreground);
    margin: 1rem 0 0.375rem; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 0.4375rem 0; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .sub { color: var(--muted-foreground); font-size: var(--text-xs); }
  .time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: var(--font-weight-semibold); margin-right: 0.375rem; }
  .tier { display: inline-block; font-size: var(--text-xs); font-weight: var(--font-weight-semibold); padding: 0 0.4375rem;
    border-radius: var(--radius-full); margin-right: 0.375rem; }
  .tier.rock { background: var(--success); color: var(--success-foreground); }
  .tier.sand { background: var(--warning); color: var(--warning-foreground); }
  .tier.water { background: var(--info); color: var(--info-foreground); }
  .gaps li { color: var(--muted-foreground); }
  .status { color: var(--muted-foreground); font-size: var(--text-xs); min-height: 1.125rem; }
  .empty { color: var(--muted-foreground); padding: 1.5rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <!--__COS_MARK__-->
    <div class="tabs">
      <button data-tab="brief" aria-pressed="true">Today</button>
      <button data-tab="week" aria-pressed="false">Week</button>
    </div>
    <button id="reload">Reload saved</button>
    <button id="run" class="run">Run new</button>
  </div>
  <div class="status" id="status"></div>
  <div id="view"><p class="empty">Waiting for the host…</p></div>
</div>

<script>
(() => {
  const view = document.getElementById("view");
  const status = document.getElementById("status");
  const runBtn = document.getElementById("run");
  const state = { tab: "brief", data: null, armed: false };

  // --- JSON-RPC over postMessage (MCP Apps, protocol 2026-01-26) ---
  let nextId = 1;
  const pending = new Map();
  const send = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ id, method, params });
  });
  const notify = (method, params) => send({ method, params });

  window.addEventListener("message", (ev) => {
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && pending.has(m.id) && !m.method) {
      const p = pending.get(m.id);
      pending.delete(m.id);
      m.error ? p.reject(new Error(m.error.message || "request failed")) : p.resolve(m.result);
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-result": accept(m.params); break;
      case "ui/notifications/host-context-changed": applyContext(m.params); break;
      case "ui/resource-teardown": send({ id: m.id, result: {} }); break;
      default: if (m.id != null) send({ id: m.id, error: { code: -32601, message: "unsupported" } });
    }
  });

  function applyContext(ctx) {
    if (ctx && ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  }

  // A tool result carries { kind: "brief", day, report }; both tabs read it.
  function accept(result) {
    const sc = result && result.structuredContent;
    if (result && result.isError) {
      const text = (result.content || []).map((c) => c.text).join(" ");
      status.textContent = text || "The tool returned an error.";
      return;
    }
    if (!sc || !sc.kind) { status.textContent = "No saved output yet. Run one."; render(); return; }
    state.data = sc;
    status.textContent = sc.cost_usd != null ? `Fresh run, $${sc.cost_usd.toFixed(2)}.` : "";
    render();
  }

  async function call(name) {
    status.textContent = name.startsWith("latest") ? "Loading…" : "Running — this calls Claude and can take a few minutes…";
    try { accept(await request("tools/call", { name, arguments: {} })); }
    catch (e) { status.textContent = `${name} failed: ${e.message}`; }
  }

  // --- rendering ---
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const section = (title, items, line, cls = "") => items && items.length
    ? `<h3>${title}</h3><ul class="${cls}">${items.map((x) => `<li>${line(x)}</li>`).join("")}</ul>` : "";

  const KIND = { done: "DONE", unblocked: "UNBLOCKED", risk: "RISK", time_changed: "TIME CHANGED" };
  const changed = (x) => `<b>${esc(KIND[x.kind] || x.kind)}</b> ${esc(x.what)}<div class="sub">${esc(x.source)}</div>`;

  function renderBrief(d) {
    const b = d.report;
    const verb = (a) => a.verb === "delegate" && a.owner ? `DELEGATE: ${a.owner}` : String(a.verb || "").toUpperCase();
    const due = (a) => !a.deadline || a.deadline_basis === "none" ? "" : ` · ${a.deadline_basis === "confirmed" ? "due" : "proposed"} ${a.deadline}`;
    const notRead = (b.coverage || []).filter((c) => c.review !== "complete" || c.health !== "healthy")
      .map((c) => `${c.source}: ${c.health}, ${c.review}${c.note ? " — " + c.note : ""}`).concat(b.gaps || []);
    return `<h2>Today</h2><div class="day">${esc(d.day)}</div><p class="headline">${esc(b.headline)}</p>`
      + section("Needs you", b.needs_you, (x) => `<b>${esc(verb(x))}</b> ${esc(x.recommendation)}<div class="sub">${esc(x.why)}${esc(due(x))} · ${esc(x.source)}</div>`)
      + section("What changed", b.what_changed, changed)
      + section("Calendar", b.calendar, (x) => `<span class="time">${esc([x.date, x.start ? `${x.start}–${x.end}` : ""].filter(Boolean).join(" "))}</span>${esc(x.what)}<div class="sub">prep: ${esc(x.prep)}</div>`)
      + section("Backlog", b.backlog, (x) => `${esc(x.item)}${x.owner ? ` (${esc(x.owner)})` : ""}<div class="sub">next review: ${esc(x.next_review)}</div>`)
      + section("Not read in full", notRead, esc, "gaps");
  }

  function renderWeek(d) {
    const w = d.report.week || {};
    const empty = !w.summary && !(w.goals || []).length && !(w.proposed || []).length;
    if (empty) return `<h2>Week</h2><div class="day">${esc(d.day)}</div><p class="empty">This brief has no week part. Run a new brief.</p>`;
    return `<h2>Week</h2><div class="day">${esc(d.day)}</div><p class="headline">${esc(w.summary)}</p>`
      + section("Goals", w.goals, (x) => `<span class="tier ${esc(x.confidence)}">${esc(x.confidence)}</span><b>${esc(x.goal)}</b><div class="sub">KPI: ${esc(x.kpi)} · ${esc(x.evidence)} → ${esc(String(x.recommendation).replace("_", " "))}: ${esc(x.next)}</div>`)
      + section("Proposed this week", w.proposed, (x) => `${esc(x.title)}<div class="sub">owner ${esc(x.owner || "unassigned")} (${esc(x.owner_basis)}) · ${x.due_date ? `${esc(x.due_date)} (${esc(x.due_basis)})` : "no date"} · done when ${esc(x.done_when)}</div>`)
      + section("Decisions", w.decisions, (x) => `${esc(x.decision)}<div class="sub">${esc((x.options || []).join(" / "))} → <b>${esc(x.recommendation)}</b></div>`)
      + section("Stop doing", w.stop_doing, esc);
  }

  function render() {
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === state.tab)));
    runBtn.textContent = state.armed ? "Confirm: spends money" : "Run new brief";
    runBtn.classList.toggle("armed", state.armed);
    const d = state.data;
    view.innerHTML = d ? (state.tab === "brief" ? renderBrief(d) : renderWeek(d))
      : `<p class="empty">Nothing loaded yet. Reload saved.</p>`;
  }

  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    state.tab = b.dataset.tab; state.armed = false; render();
    if (!state.data) call("latest_brief");
  }));
  document.getElementById("reload").addEventListener("click", () => call("latest_brief"));
  // Two clicks to spend: a fresh run costs real money and minutes.
  runBtn.addEventListener("click", () => {
    if (!state.armed) { state.armed = true; render(); setTimeout(() => { state.armed = false; render(); }, 4000); return; }
    state.armed = false; render(); call("brief");
  });

  new ResizeObserver(() => notify("ui/notifications/size-changed", {
    width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight,
  })).observe(document.body);

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    clientInfo: { name: "cos-dashboard", version: "0.1.0" },
    appCapabilities: {},
  }).then((res) => {
    applyContext(res && res.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch((e) => { status.textContent = `Host handshake failed: ${e.message}`; });
})();
</script>
</body>
</html>
