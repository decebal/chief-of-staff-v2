<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cos flows</title>
<style>
/*__COS_TOKENS__*/
html,body{height:100%}
[hidden]{display:none !important}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-sm);line-height:var(--text-sm--line-height);overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit}
.app{display:grid;grid-template-columns:auto 1fr auto;height:100vh}
.app.dash-host .host-only{display:none}
/* sidebar */
nav.side{width:15rem;border-right:1px solid var(--sidebar-border);background:var(--sidebar);color:var(--sidebar-foreground);display:flex;flex-direction:column;gap:0.75rem;padding:0.75rem;overflow-y:auto;box-sizing:border-box}
.app.collapsed nav.side{width:3rem;padding:0.75rem 0.375rem;align-items:center}
.app.collapsed nav.side .wide{display:none}
nav.side .rail{display:none}
.app.collapsed nav.side .rail{display:flex;flex-direction:column;gap:0.5rem;align-items:center}
.side h2{font-size:var(--text-xs);line-height:var(--text-xs--line-height);font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--muted-foreground);margin:0 0 0.25rem}
.side input[type=search]{width:100%;box-sizing:border-box;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--background);color:var(--foreground);padding:0.375rem 0.5rem;font-size:var(--text-sm)}
.side ul{list-style:none;margin:0;padding:0}
.side li button{display:flex;width:100%;justify-content:space-between;gap:0.5rem;border:0;background:none;padding:0.25rem 0.5rem;border-radius:var(--radius-sm);cursor:pointer;text-align:left}
.side li button:hover,.side li button[aria-pressed=true]{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.side .n{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.side details summary{cursor:pointer;font-size:var(--text-xs);font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--muted-foreground);padding:0.25rem 0}
.side label{display:flex;gap:0.5rem;align-items:center;padding:0.125rem 0.25rem;cursor:pointer}
.side label span:first-of-type{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .gapline{border:1px solid var(--warning);border-radius:var(--radius-md);padding:0.375rem 0.5rem;font-size:var(--text-xs)}
.iconbtn{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-md);padding:0.25rem 0.5rem;cursor:pointer;min-width:2rem}
.iconbtn:hover{background:var(--accent);color:var(--accent-foreground)}
:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
header.top{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0.75rem;border-bottom:1px solid var(--border)}
.crumbs{display:flex;gap:0.375rem;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.crumbs button{border:0;background:none;cursor:pointer;padding:0;min-height:1.5rem;color:var(--muted-foreground)}
.crumbs button:hover{color:var(--foreground);text-decoration:underline}
.crumbs .here{color:var(--foreground);font-weight:var(--font-weight-medium);overflow:hidden;text-overflow:ellipsis}
.views{display:flex;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;flex:none}
.views button{border:0;background:none;padding:0.25rem 0.75rem;cursor:pointer}
.views button[aria-selected=true]{background:var(--primary);color:var(--primary-foreground)}
.find{margin-left:auto;display:flex;align-items:center;gap:0.5rem;border:1px solid var(--input);border-radius:var(--radius-md);padding:0.25rem 0.5rem;background:var(--background);color:var(--muted-foreground);cursor:pointer;min-width:14rem}
.find kbd,.keys kbd{font-family:var(--font-mono);font-size:var(--text-xs);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 0.25rem;margin-left:auto}
.scanned{color:var(--muted-foreground);font-size:var(--text-xs);white-space:nowrap}
.refresh{flex:none;white-space:nowrap}
.muted{color:var(--muted-foreground)}
.small{font-size:var(--text-xs);line-height:var(--text-xs--line-height)}
/* needs you */
.needs{padding:0.5rem 0.75rem;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:0.375rem}
.needs h2{margin:0;font-size:var(--text-sm);font-weight:var(--font-weight-semibold)}
.need{display:flex;align-items:center;gap:0.75rem}
.need .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);border-radius:var(--radius-md);padding:0.125rem 0.625rem;cursor:pointer;white-space:nowrap}
.hire-row{display:flex;flex-wrap:wrap;gap:0.5rem 0.75rem;align-items:center;margin:0.75rem 0}
.hire-row .act{min-height:1.5rem}
.hire-row .act:disabled{opacity:.55;cursor:not-allowed}
.hire-row .handoff{flex-basis:100%}
.hire-row .handoff pre{white-space:pre-wrap;font-family:var(--font-mono);font-size:var(--text-xs);margin:0.375rem 0 0}
.act.ghost{background:none;color:var(--foreground);border-color:var(--border)}
.step{font-family:var(--font-mono);font-size:var(--text-xs);line-height:var(--text-xs--line-height);font-weight:var(--font-weight-semibold);border-radius:var(--radius-full);padding:0.0625rem 0.5rem;background:var(--secondary);color:var(--secondary-foreground);white-space:nowrap}
.step.think,.step.spec{background:var(--info);color:var(--info-foreground)}
.step.plan,.step.review{background:var(--warning);color:var(--warning-foreground)}
.step.build,.step.ship{background:var(--primary);color:var(--primary-foreground)}
.step.drift{background:var(--destructive);color:var(--destructive-foreground)}
.step.reflect,.step.done{background:var(--success);color:var(--success-foreground)}
.view{flex:1;min-height:0;position:relative}
/* board */
.board{overflow:auto;padding:0.75rem}
.boardbar{display:flex;gap:0.75rem;align-items:center;margin:0 0 0.5rem;color:var(--muted-foreground);font-size:var(--text-xs)}
.boardbar select{font-size:var(--text-xs);border:1px solid var(--input);border-radius:var(--radius-sm);background:var(--background);color:var(--foreground);padding:0.125rem 0.25rem}
.lane{margin:0 0 1rem}
.lane>h3{margin:0 0 0.375rem;font-size:var(--text-sm);font-weight:var(--font-weight-semibold)}
.cols{display:flex;gap:0.75rem;align-items:flex-start}
.col{flex:0 0 16rem;display:flex;flex-direction:column;gap:0.5rem}
.col>h4{margin:0;display:flex;gap:0.5rem;align-items:center;font-size:var(--text-xs);font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--muted-foreground)}
.col.folded{flex-basis:auto}
.col.folded button.unfold{border:1px dashed var(--border);background:none;border-radius:var(--radius-md);padding:0.5rem 0.75rem;cursor:pointer;color:var(--muted-foreground)}
.fcard{position:relative;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);color:var(--card-foreground);box-shadow:var(--shadow-sm)}
.fcard.needs-you{border-color:var(--brand-amber)}
.fcard>button.open{display:block;width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:0.625rem 2rem 0.625rem 0.75rem;border-radius:var(--radius-lg)}
.fcard>button.open:hover{background:var(--accent)}
.fcard .repo{font-size:var(--text-xs);color:var(--muted-foreground)}
.fcard .title{font-weight:var(--font-weight-medium);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .id{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--muted-foreground)}
.bar{height:0.25rem;border-radius:var(--radius-full);background:var(--muted);margin:0.375rem 0 0.25rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--success)}
.fcard .meta{display:flex;flex-wrap:wrap;gap:0.25rem 0.5rem;font-size:var(--text-xs);color:var(--muted-foreground)}
.chip{display:inline-flex;align-items:center;gap:0.25rem;font-size:var(--text-xs);border:1px solid var(--border);border-radius:var(--radius-full);padding:0 0.375rem;white-space:nowrap}
.chip.warn{border-color:var(--brand-amber)}
.pin{position:absolute;top:0.375rem;right:0.375rem;min-width:1.5rem;min-height:1.5rem;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer;color:var(--muted-foreground);font-size:var(--text-base)}
.pin[aria-pressed=true]{color:var(--brand-amber)}
.empty{color:var(--muted-foreground);padding:1rem}
/* flow view */
.flowview{display:flex;flex-direction:column}
ol.rail{display:flex;gap:0.25rem;list-style:none;margin:0;padding:0.5rem 0.75rem;border-bottom:1px solid var(--border);overflow-x:auto}
ol.rail li{font-size:var(--text-xs);padding:0.125rem 0.5rem;border-radius:var(--radius-full);border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap}
ol.rail li.past{color:var(--foreground)}
ol.rail li[aria-current]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground);font-weight:var(--font-weight-semibold)}
ol.rail li button{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;color:inherit}
.canvas{flex:1;position:relative;overflow:hidden;background:var(--background);cursor:grab;touch-action:none;outline:0}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--chart-axis);stroke-width:1.5}
.edges path.open{stroke:var(--warning);stroke-dasharray:6 4}
.edges path.crit{stroke:var(--destructive);stroke-width:2.5}
.world.dim .edges path:not(.lit){opacity:0.15}
.world.dim .bcard:not(.lit),.world.dim .startnode:not(.lit){opacity:0.3}
.bcard{position:absolute;box-sizing:border-box;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);color:var(--card-foreground);padding:0.5rem 0.625rem;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:0.25rem;box-shadow:var(--shadow-sm)}
.bcard .h{display:flex;gap:0.375rem;align-items:center;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--muted-foreground)}
.bcard .h .state{margin-left:auto;font-family:var(--font-sans);font-weight:var(--font-weight-semibold)}
.bcard .t{font-weight:var(--font-weight-medium);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard .f{display:flex;gap:0.5rem;align-items:center;font-size:var(--text-xs);color:var(--muted-foreground);margin-top:auto}
.bcard .f .bar{flex:1;margin:0}
.bcard.done{background:var(--muted);color:var(--muted-foreground)}
.bcard.done .state{color:var(--success)}
.bcard.active{border:2px solid var(--primary)}
.bcard.active .state{color:var(--primary)}
.bcard.ready{border:2px solid var(--success)}
.bcard.ready .state{color:var(--success)}
.bcard.blocked{border:1px dashed var(--brand-amber)}
.bcard.blocked .state{color:var(--warning)}
.bcard.ghost{border-style:dotted;background:none;box-shadow:none;cursor:default}
.bcard.sel{outline:2px solid var(--ring);outline-offset:2px}
.bcard.crit{box-shadow:0 0 0 2px var(--destructive)}
@media (prefers-reduced-motion:no-preference){.bcard.active{animation:breathe 2s ease-in-out infinite}}
@keyframes breathe{50%{box-shadow:0 0 0 2px var(--ring)}}
.startnode{position:absolute;box-sizing:border-box;border-radius:var(--radius-full);border:2px solid var(--primary);background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;font-family:var(--font-mono);font-size:var(--text-xs);text-align:center}
.ctrls{position:absolute;right:0.75rem;bottom:0.75rem;display:flex;gap:0.25rem;align-items:flex-end}
.ctrls .iconbtn{background:var(--card)}
.toggle[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}
svg.mini{width:10rem;height:6rem;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);cursor:pointer}
svg.mini rect.b{fill:var(--muted-foreground)}
svg.mini rect.vp{fill:none;stroke:var(--ring);stroke-width:2;vector-effect:non-scaling-stroke}
/* map */
.mapview{display:flex;flex-direction:column}
.mapbox{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:var(--background)}
.mapbox canvas.gpu{position:absolute;inset:0;width:100%;height:100%}
.mapbox svg.map{position:absolute;inset:0;width:100%;height:100%}
.map .mnode rect{fill:var(--card);stroke:var(--border);stroke-width:1.5}
.map .mnode.done rect{fill:var(--muted)}
.map .mnode.active rect{stroke:var(--primary);stroke-width:3}
.map .mnode.ready rect{stroke:var(--success);stroke-width:3}
.map .mnode.blocked rect{stroke:var(--brand-amber);stroke-dasharray:6 4}
.map .mnode.start rect{stroke:var(--primary);stroke-width:2}
.map .mnode.sel rect{stroke:var(--ring);stroke-width:4}
.map .mnode text{fill:var(--foreground);font-family:var(--font-mono);font-size:var(--text-xs)}
.map .mnode text.sub{fill:var(--muted-foreground);font-family:var(--font-sans)}
.map .mnode text.st{font-family:var(--font-sans);font-weight:var(--font-weight-semibold);fill:var(--muted-foreground)}
.map .mnode text.st.active{fill:var(--primary)}
.map .mnode text.st.ready{fill:var(--success)}
.map .mnode text.st.blocked{fill:var(--warning)}
.map.lod .mnode text{display:none}
.map .medge{fill:none;stroke:var(--chart-axis);stroke-width:1.5;stroke-linejoin:round}
.map .medge.open{stroke:var(--warning)}
.map .medge.hint{stroke-dasharray:5 4}
.map .band{fill:var(--foreground);font-size:var(--text-sm);font-weight:var(--font-weight-semibold)}
.map .repo{fill:var(--muted-foreground);font-size:var(--text-lg);font-weight:var(--font-weight-semibold)}
.map.dim .mnode:not(.lit),.map.dim .medge:not(.lit){opacity:0.2}
.mapfoot{display:flex;gap:1rem;align-items:center;padding:0.375rem 0.75rem;border-top:1px solid var(--border);font-size:var(--text-xs);color:var(--muted-foreground)}
.mapfoot details{margin-left:auto}
.mapfoot details[open]{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:0.375rem 0.5rem}
/* drawer */
aside.drawer{width:24rem;border-left:1px solid var(--border);background:var(--popover);color:var(--popover-foreground);overflow-y:auto;padding:0.75rem 1rem;box-sizing:border-box}
aside.drawer h2{font-size:var(--text-lg);line-height:var(--text-lg--line-height);margin:0.25rem 0 0.5rem}
aside.drawer .x{float:right}
aside.drawer dl{display:grid;grid-template-columns:auto 1fr;gap:0.25rem 0.75rem;margin:0.5rem 0;font-size:var(--text-xs)}
aside.drawer dt{color:var(--muted-foreground)}
aside.drawer dd{margin:0;overflow-wrap:anywhere}
aside.drawer details{margin:0.5rem 0;border-top:1px solid var(--border);padding-top:0.5rem}
aside.drawer details summary{cursor:pointer;padding-block:0.125rem;font-weight:var(--font-weight-semibold)}
aside.drawer h3{font-size:var(--text-sm);margin:0.75rem 0 0.25rem}
ul.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.25rem}
ul.crit li{display:flex;gap:0.5rem}
ul.crit li.done{color:var(--muted-foreground)}
ul.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.25rem}
ul.links li{display:flex;gap:0.5rem;align-items:center}
ul.links li code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--text-xs)}
.link{border:0;background:none;padding:0;min-height:1.5rem;color:var(--brand-text);cursor:pointer;text-decoration:underline;text-align:left}
code{font-family:var(--font-mono);font-size:var(--text-xs)}
@media (max-width:48rem){.app{grid-template-columns:auto 1fr}aside.drawer{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:60vh;border-left:0;border-top:1px solid var(--border)}}
/* dialogs */
dialog{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--popover);color:var(--popover-foreground);padding:0;width:min(40rem,90vw);box-shadow:var(--shadow-md)}
dialog::backdrop{background:var(--overlay)}
.pal-in{display:flex;flex-wrap:wrap;gap:0.25rem;align-items:center;padding:0.5rem 0.75rem;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;min-width:10rem;border:0;background:none;color:var(--foreground);font-size:var(--text-base);outline:0;padding:0.25rem}
.pal-list{max-height:24rem;overflow-y:auto;padding:0.25rem 0;margin:0;list-style:none}
.pal-list .grp{padding:0.375rem 0.75rem 0.125rem;font-size:var(--text-xs);color:var(--muted-foreground);text-transform:uppercase;letter-spacing:var(--tracking-wide)}
.pal-list .opt{display:flex;gap:0.5rem;padding:0.375rem 0.75rem;cursor:pointer}
.pal-list .opt[aria-selected=true]{background:var(--accent);color:var(--accent-foreground)}
.pal-list .opt .s{margin-left:auto;color:var(--muted-foreground);font-size:var(--text-xs)}
.keys{padding:1rem}
.keys table{border-collapse:collapse;width:100%}
.keys td{padding:0.25rem 0.5rem;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="Flows: search, views and filters">
    <div class="rail">
      <button class="iconbtn" type="button" data-act="sidebar" aria-label="Open the sidebar">»</button>
      <button class="iconbtn" type="button" data-act="palette" aria-label="Search (⌘K)">⌕</button>
      <button class="iconbtn" type="button" data-preset="needs" aria-label="Needs you"><span id="rail-needs">0</span></button>
    </div>
    <div class="wide"><input id="q" type="search" placeholder="Search flows and beads ( / )" aria-label="Search flows and beads" autocomplete="off"></div>
    <div class="wide" id="gapline" hidden></div>
    <div class="wide"><h2>Views</h2><ul id="presets"></ul></div>
    <div class="wide"><h2>Pinned</h2><ul id="pins"></ul></div>
    <div class="wide" id="facets"></div>
  </nav>
  <div class="main">
    <header class="top">
      <button class="iconbtn" type="button" data-act="sidebar" id="sidebar-toggle" aria-label="Collapse the sidebar (⌘B)" aria-expanded="true">«</button>
      <div class="crumbs" id="crumbs" aria-label="Where you are"></div>
      <div class="views" role="tablist" aria-label="View">
        <button type="button" role="tab" data-view="board" aria-selected="true">Board</button>
        <button type="button" role="tab" data-view="flow" aria-selected="false">Flow</button>
        <button type="button" role="tab" data-view="map" aria-selected="false">Map</button>
      </div>
      <button class="find" type="button" data-act="palette" aria-label="Search and commands (⌘K)">⌕ Search flows, beads, commands <kbd>⌘K</kbd></button>
      <span class="scanned" id="scanned"></span>
      <button class="iconbtn refresh" type="button" data-act="rescan" title="Scan the task stores again (R)"><span aria-hidden="true">⟳</span> Refresh</button>
    </header>
    <div class="needs" id="needs" hidden></div>
    <div class="view board" id="board" role="region" aria-label="Board"></div>
    <div class="view flowview" id="flow" hidden>
      <ol class="rail" id="steprail" aria-label="Ritual steps"></ol>
      <div class="canvas" id="canvas" tabindex="-1" aria-label="Bead graph">
        <div class="world" id="world"><svg class="edges" id="edges" aria-hidden="true"></svg><div id="cards"></div></div>
        <div class="ctrls">
          <button class="iconbtn toggle" type="button" data-act="crit" aria-pressed="false">Critical path</button>
          <button class="iconbtn" type="button" data-act="zoom-out" aria-label="Zoom out">−</button>
          <button class="iconbtn" type="button" data-act="zoom-in" aria-label="Zoom in">+</button>
          <button class="iconbtn" type="button" data-act="fit" aria-label="Fit the graph">Fit</button>
          <svg class="mini" id="mini" aria-label="Minimap"></svg>
        </div>
      </div>
    </div>
    <div class="view mapview" id="map" hidden>
      <div class="mapbox" id="mapbox"><svg class="map" id="mapsvg" role="img" aria-label="Every open bead"><g id="mapworld"></g></svg></div>
      <div class="mapfoot">
        <span id="mapnote"></span>
        <span id="engine-line"></span>
        <details class="settings"><summary>Graph engine</summary>
          <label><input type="radio" name="engine" value="auto"> Auto (GPU when it starts in time)</label>
          <label><input type="radio" name="engine" value="svg"> SVG</label>
        </details>
      </div>
    </div>
  </div>
  <aside class="drawer" id="drawer" hidden aria-label="Details"></aside>
</div>
<dialog id="palette" aria-label="Search and commands">
  <div class="pal-in" id="pal-in"><input id="pal-q" type="text" placeholder="Search, or type repo: step: state: owner:" aria-label="Search and commands" autocomplete="off" role="combobox" aria-controls="pal-list" aria-expanded="true"></div>
  <ul class="pal-list" id="pal-list" role="listbox"></ul>
</dialog>
<dialog id="keys" aria-label="Keyboard shortcuts"><div class="keys"><h2>Keyboard</h2><table id="keytable"></table></div></dialog>
<script>
/*__COS_VGPU__*/
const DATA = /*__COS_FLOWS__*/;
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const ds = document.body.dataset;
  const NS = "http://www.w3.org/2000/svg";
  const h = (tag, attrs, ...kids) => {

  const palClose = () => {
    if (!$("palette").open) return;
    $("palette").close();
    if (pal.chips.length) { for (const [k, v] of pal.chips) S.facets[k].add(v); pal.chips = []; if (S.view === "flow") S.view = "board"; render(); commit(false); }
    pal.ret?.focus?.();
  };
  const palRun = (i) => { const it = pal.items[i]; if (!it) return; if (it.run() === "keep") return; palClose(); };
  $("pal-q").addEventListener("input", () => { pal.at = 0; palRender(); });
  $("pal-q").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { pal.at = Math.min(pal.items.length - 1, pal.at + 1); palRender(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { pal.at = Math.max(0, pal.at - 1); palRender(); e.preventDefault(); }
    else if (e.key === "Enter") { palRun(pal.at); e.preventDefault(); }
    else if (e.key === "Backspace" && !$("pal-q").value && pal.chips.length) { pal.chips.pop(); palChips(); palRender(); }
  });
  $("palette").addEventListener("cancel", (e) => { e.preventDefault(); palClose(); });
  $("palette").addEventListener("click", (e) => { if (e.target === $("palette")) palClose(); });

  const KEYS = [["⌘K", "Search and commands"], ["r", "Refresh: scan the task stores again"], ["/", "Search box"], ["⌘B or [", "Sidebar"], ["g b · g f · g m", "Board · Flow · Map"], ["j / k", "Next / previous card on the board"],
    ["Enter", "Open"], ["Esc", "Close, then back"], ["Arrows", "Move along the graph's edges"], ["f", "Fit"], ["+ / −", "Zoom"], ["p", "Pin the focused flow"], ["?", "This sheet"]];
  $("keytable").append(...KEYS.map(([k, t]) => h("tr", {}, h("td", {}, h("kbd", { text: k })), h("td", { text: t }))));

  // ---- navigation
  const setPref = (k, v) => { prefs[k] = v; savePrefs(); render(); };
  const clearFilters = () => { S.q = ""; $("q").value = ""; S.preset = "all"; for (const k of FACETS) S.facets[k].clear(); render(); commit(false); };
  const go = (view) => { if (view === "flow" && !S.flow) { const f = flowFor(); if (!f) return; return openFlow(f.key); } S.view = view; if (view !== "flow") { S.bead = null; } render(); commit(true); };
  const openFlow = (key) => { if (!byKey.has(key)) return; S.flow = key; S.bead = null; S.view = "flow"; render(); commit(true); requestAnimationFrame(fit); };
  // In the app the window rescans and reloads this frame; under `cos dash`
  // the page asks its server for a fresh scan, keeping the view in the hash.
  const rescan = () => {
    const b = document.querySelector('[data-act="rescan"]');
    if (b) { b.disabled = true; b.lastChild.textContent = " Refreshing…"; }
    if (HOST) return post({ type: "cos-flows-rescan", hash: hashOf() });
    const q = new URLSearchParams(location.search); q.set("fresh", "1");
    location.replace(`${location.pathname}?${q}#${hashOf()}`);
  };

  let mapReady = false;
  const render = () => {
    for (const v of ["board", "flow", "map"]) $(v).hidden = S.view !== v;
    ds.view = S.view;
    drawTop(); drawSide(); drawNeeds();
    if (S.view === "board") drawBoard();
    if (S.view === "flow") { drawFlow(); if (S.bead) drawDrawer(); }
    if (S.view === "map") { syncMap(); if (!mapReady) { mapReady = true; requestAnimationFrame(mapFit); } }
    $("drawer").hidden = !S.bead || S.view === "board";
    if (!$("drawer").hidden && S.view !== "flow") drawDrawer();
    for (const b of document.querySelectorAll("[data-act=crit]")) b.setAttribute("aria-pressed", String(S.crit));
    ds.flows = String(shownFlows().length);
  };

  // ---- events
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button,[data-epic],[role=button]"); if (!t) return;
    const d = t.dataset;
    if (d.open) return openFlow(d.open);
    if (d.pin) { const i = prefs.pins.indexOf(d.pin); if (i >= 0) prefs.pins.splice(i, 1); else prefs.pins.push(d.pin); savePrefs(); render(); return; }
    if (d.preset) { S.preset = d.preset; if (S.view === "flow") S.view = "board"; render(); commit(false); return; }
    if (d.view) return go(d.view);
    if (d.go === "board") { S.q = ""; $("q").value = ""; S.preset = "all"; for (const k of FACETS) S.facets[k].clear(); return go("board"); }
    if (d.go === "board-repo") { const f = byKey.get(S.flow); S.facets.repo = new Set([f.repo]); return go("board"); }
    if (d.go === "flow") { S.bead = null; $("drawer").hidden = true; return commit(false); }
    if (d.bead) { highlight(d.bead); return openDrawer(d.bead, t); }
    if (d.beadLink) { focusBead(d.beadLink); return openDrawer(d.beadLink); }
    if (d.epic) return openDrawer("epic", t);
    if (d.file) return openFile(byKey.get(S.flow), d.file);
    if (d.copy != null) {
      const done = () => { t.textContent = "Copied"; };
      const refused = (err) => { t.textContent = "Copy is blocked here: select the text instead"; console.debug("flows: copy refused", err); };
      if (navigator.clipboard) navigator.clipboard.writeText(d.copy).then(done, refused); else refused("no clipboard");
      return;
    }
    const act = d.act;
    if (act === "sidebar") { setSide(prefs.side === "closed" ? "open" : "closed"); savePrefs(); }
    else if (act === "palette") palOpen();
    else if (act === "rescan") rescan();
    else if (act === "show-done") { S.showDone = true; render(); commit(false); }
    else if (act === "clear") clearFilters();
    else if (act === "close-drawer") closeDrawer();
    else if (act === "crit") { S.crit = !S.crit; render(); }
    else if (act === "fit") fit();
    else if (act === "zoom-in") zoomAt(1.25);
    else if (act === "zoom-out") zoomAt(0.8);
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.facet && t.type === "checkbox") { const set = S.facets[t.dataset.facet]; if (t.checked) set.add(t.value); else set.delete(t.value); if (S.view === "flow") S.view = "board"; render(); commit(false); }
    else if (t.dataset.pref) setPref(t.dataset.pref, t.value);
    else if (t.name === "engine" && t.checked) {
      prefs.engine = t.value; savePrefs();
      if (prefs.engine === "svg") { attempt++; if (engine.kind === "gpu") toSvg(""); engineNote = ""; ds.engineState = "decided"; drawEngineLine(); stamp(); }
      else if (engine.kind === "svg") pickEngine();
    }
  });
  $("q").addEventListener("input", () => { S.q = $("q").value.slice(0, 200); if (S.view === "flow") S.view = "board"; render(); commit(false); });
  $("cards").addEventListener("pointerover", (e) => { const c = e.target.closest("[data-bead]"); if (c) highlight(c.dataset.bead); });
  $("cards").addEventListener("pointerleave", () => highlight(null));
  $("cards").addEventListener("focusin", (e) => { const c = e.target.closest("[data-bead]"); if (c) highlight(c.dataset.bead); });

  // pan and zoom: the flow canvas and the map share the gesture code
  const pannable = (box, get, set, onClick) => {
    let drag = null;
    box.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || e.target.closest("button,.ctrls,[data-epic],a")) return;
      drag = { x: e.clientX, y: e.clientY, t: { ...get() }, moved: false };
      box.setPointerCapture(e.pointerId); box.classList.add("panning");
    });
    box.addEventListener("pointermove", (e) => {
      if (!drag) { onClick?.(e, "hover"); return; }
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      set({ ...drag.t, x: drag.t.x + dx, y: drag.t.y + dy });
    });
    box.addEventListener("pointerup", (e) => { if (drag && !drag.moved) onClick?.(e, "click"); drag = null; box.classList.remove("panning"); });
    box.addEventListener("wheel", (e) => {
      e.preventDefault();
      const t = get(), b = box.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) { const k = clamp(t.k * Math.exp(-e.deltaY * 0.01), 0.03, 2.5), px = e.clientX - b.left, py = e.clientY - b.top; set({ k, x: px - (px - t.x) * (k / t.k), y: py - (py - t.y) * (k / t.k) }); }
      else set({ ...t, x: t.x - e.deltaX, y: t.y - e.deltaY });
    }, { passive: false });
  };
  pannable($("canvas"), () => T, (t) => { T = t; applyT(); });
  pannable($("mapbox"), () => MT, (t) => { MT = t; applyMT(); }, (e, kind) => {
    const id = engine.pick(e);
    if (kind === "hover") { if (id !== mapSel.hover) { mapSel.hover = id; engine.focus(); } return; }
    mapSel.id = id; engine.focus();
    const n = id && M.byId.get(id); if (!n) return;
    S.flow = n.key; if (n.bead) openDrawer(n.bead); else openDrawer("epic");
  });
  $("mapbox").addEventListener("dblclick", (e) => { const id = engine.pick(e); const n = id && M.byId.get(id); if (n) openFlow(n.key); });
  $("mini").addEventListener("click", (e) => {
    if (!layout) return; const r = $("mini").getBoundingClientRect(), W = layout.bounds.x1 + 40, H = layout.bounds.y1 + 40;
    const sc = Math.min(r.width / W, r.height / H), gx = (e.clientX - r.left - (r.width - W * sc) / 2) / sc, gy = (e.clientY - r.top - (r.height - H * sc) / 2) / sc, b = $("canvas").getBoundingClientRect();
    T = { ...T, x: b.width / 2 - gx * T.k, y: b.height / 2 - gy * T.k }; applyT();
  });
  addEventListener("resize", () => { if (S.view === "flow") drawMini(); if (S.view === "map") engine.draw(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => engine.restyle());

  let gPrefix = 0;
  document.addEventListener("keydown", (e) => {
    const typing = e.target.closest?.("input,textarea,select");
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); if ($("palette").open) palClose(); else palOpen(); return; }
    if ($("palette").open) return;
    if (e.key === "Escape") {
      if ($("keys").open) return;
      if (typing && e.target.id === "q" && S.q) { return; }
      if (!$("drawer").hidden) { e.preventDefault(); closeDrawer(); return; }
      if (S.view !== "board") { e.preventDefault(); go("board"); }
      return;
    }
    if (typing) return;
    if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); setSide(prefs.side === "closed" ? "open" : "closed"); savePrefs(); return; }
    if (mod) return;
    if (gPrefix && Date.now() - gPrefix < 1200) { gPrefix = 0; if (e.key === "b") return go("board"); if (e.key === "f") return go("flow"); if (e.key === "m") return go("map"); }
    if (e.key === "g") { gPrefix = Date.now(); return; }
    if (e.key === "/") { e.preventDefault(); if (prefs.side === "closed") setSide("open"); $("q").focus(); return; }
    if (e.key === "[") { setSide(prefs.side === "closed" ? "open" : "closed"); savePrefs(); return; }
    if (e.key === "?") { $("keys").showModal(); return; }
    if (e.key === "r") { rescan(); return; }
    if (S.view === "board" && (e.key === "j" || e.key === "k")) {
      const cards = [...$("board").querySelectorAll(".fcard>button.open")], i = cards.indexOf(document.activeElement);
      const next = cards[e.key === "j" ? Math.min(cards.length - 1, i + 1) : Math.max(0, i - 1)]; next?.focus(); next?.scrollIntoView({ block: "nearest", inline: "nearest" }); return;
    }
    if (e.key === "p") { const k = document.activeElement?.closest?.(".fcard")?.dataset.key || (S.view === "flow" ? S.flow : null); if (k) { const i = prefs.pins.indexOf(k); if (i >= 0) prefs.pins.splice(i, 1); else prefs.pins.push(k); savePrefs(); render(); } return; }
    if (S.view === "flow") {
      if (e.key === "f") return fit();
      if (e.key === "+" || e.key === "=") return zoomAt(1.25);
      if (e.key === "-") return zoomAt(0.8);
      if (e.key === "0") { T = { k: 1, x: 40, y: 40 }; return applyT(); }
      if (e.key.startsWith("Arrow")) {
        const cur = document.activeElement?.dataset?.bead;
        const f = layout?.f;
        const target = cur ? moveFocus(cur, e.key) : f?.beads.find((b) => b.ready)?.id || f?.beads[0]?.id;
        if (target) { e.preventDefault(); focusBead(target); }
      }
    }
    if (S.view === "map" && e.key === "f") mapFit();
  });
  addEventListener("hashchange", () => { if (location.hash.slice(1) === hashOf()) return; readHash(); render(); post({ type: "cos-flows-state", hash: hashOf() }); });

  // ---- start
  readHash();
  $("q").value = S.q;
  setSide(prefs.side);
  document.querySelectorAll('input[name="engine"]').forEach((r) => { r.checked = r.value === prefs.engine; });
  Object.assign(ds, { engineState: "choosing", lateDropped: "0", lateDevice: "0", adapter: "" });
  stamp(); drawEngineLine(); drawScanned(); setInterval(drawScanned, 30000);
  render();
  if (S.view === "flow") requestAnimationFrame(fit);
  // `#pal=<text>` opens the palette with that text typed, e.g. a link to `repo:`.
  const linkedPal = new URLSearchParams(location.hash.slice(1)).get("pal");
  if (linkedPal != null) { palOpen(); $("pal-q").value = linkedPal.slice(0, 100); palRender(); }
  pickEngine();

  // ?engine-test: a hook for the headless-Chrome tests, reaching only this page's state and GPU device.
  if (TEST != null) {
    const until = (pred, ms = 20000) => new Promise((res, rej) => {
      const end = performance.now() + ms;
      const t = () => { if (pred()) return res(); if (performance.now() > end) return rej(new Error(`waited ${ms} ms: engine=${ds.engine} state=${ds.engineState}`)); setTimeout(t, 20); };
      t();
    });
    globalThis.cosFlowsTest = {
      go: (v) => { go(v); return new Promise((r) => requestAnimationFrame(() => r(ds.view))); },
      openFlow: (k) => { openFlow(k); return new Promise((r) => requestAnimationFrame(() => r(S.flow))); },
      state: () => ({ view: S.view, flow: S.flow, bead: S.bead, q: S.q, preset: S.preset, facets: Object.fromEntries(FACETS.map((k) => [k, [...S.facets[k]]])), group: prefs.group, sort: prefs.sort, pins: [...prefs.pins] }),
      screenOfMap: (id) => { const n = M.byId.get(id), b = $("mapbox").getBoundingClientRect(); return n ? [b.left + MT.x + (n.x + n.w / 2) * MT.k, b.top + MT.y + (n.y + n.h / 2) * MT.k] : null; },
      mapIds: () => M.nodes.map((n) => n.id),
      token: (k) => tokenRgb(k).slice(0, 3).map((x) => Math.round(x * 255)),
      mapZoom: (k) => { MT = { k, x: 20, y: 20 }; applyMT(); return new Promise((r) => requestAnimationFrame(() => r(MT.k))); },
      loseDevice: () => { engine.device?.destroy(); return until(() => ds.engine === "svg"); },
      uncapturedError: () => { const d = engine.device; d?.createBuffer({ size: 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.STORAGE }); d?.queue.submit([]); d?.queue.onSubmittedWorkDone().catch(() => {}); return until(() => ds.engine === "svg"); },
    };
  }
})();
</script>
</body>
