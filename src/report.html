<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chief of staff</title>
<style>
/*__COS_TOKENS__*/
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; }
  main { max-width: 73.75rem; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
  a { color: var(--brand-text); }
  button { font-family: var(--font-sans); font-size: var(--text-sm); color: var(--foreground); background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.375rem 0.75rem; cursor: pointer; box-shadow: var(--shadow-sm); }
  button:hover { background: var(--accent); }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  button.primary:hover { background: var(--primary); }
  button.done { border-color: var(--success); color: var(--success); }
  .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 1.125rem 1.25rem; box-shadow: var(--shadow-sm); }
  h2 { font-size: var(--text-base); margin: 0 0 0.25rem; }
  h3 { font-size: var(--text-xs); line-height: var(--text-xs--line-height); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--muted-foreground); font-weight: var(--font-weight-semibold); margin: 0 0 0.625rem; }
  h3.spaced { margin-top: 0.875rem; }
  .sub { color: var(--muted-foreground); font-size: var(--text-sm); }
  .sub.spaced { margin-top: 0.625rem; }
  .muted { color: var(--muted-foreground); }
  .small { font-size: var(--text-xs); }
  .grid { display: grid; gap: 1rem; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(min(21.25rem, 100%), 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(min(16.25rem, 100%), 1fr)); }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(min(8.75rem, 100%), 1fr)); }
  section { margin-top: 1rem; }
  /* A grid track sizes to its widest child by default; a chart or a long URL
     would push the page wider than a phone. */
  .grid > *, .celebrate > * { min-width: 0; }
  .sub, .ids, .wins a, .headline, .item, td.ids { overflow-wrap: anywhere; }
  @media (max-width: 32.5rem) {
    main { padding: 1rem 1rem 3rem; }
    .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { padding: 0.875rem; }
    .tile .v { font-size: var(--text-xl); }
  }

  /* celebrations */
  .celebrate { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 1rem; }
  @media (max-width: 56.25rem) { .celebrate { grid-template-columns: minmax(0, 1fr); } }
  .wins li, .soon li { list-style: none; padding: 0.5rem 0; border-top: 1px solid var(--border); }
  .wins li:first-child, .soon li:first-child { border-top: 0; }
  .wins, .soon { margin: 0; padding: 0; }
  .wins .mark { color: var(--success); font-weight: var(--font-weight-bold); margin-right: 0.375rem; }
  .wins .mark.bad { color: var(--destructive); }
  .wins-card { border-top: 0.1875rem solid var(--success); }
  .soon-card { border-top: 0.1875rem solid var(--brand-amber); }
  .date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: var(--font-weight-semibold); margin-right: 0.5rem; }
  .countdown { color: var(--muted-foreground); font-size: var(--text-xs); }

  /* hero: the ink band, the cos mark repeated faint behind it */
  .hero { position: relative; overflow: hidden; background: var(--hero); color: var(--hero-foreground); }
  .hero-pattern { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero-in { position: relative; max-width: 73.75rem; margin: 0 auto; padding: 1rem 1.5rem 1.75rem; }
  .hero-top { display: flex; align-items: center; gap: 0.75rem; min-height: 2.25rem; }
  .hero-top > svg { width: var(--icon-lg); height: var(--icon-lg); flex: none; }
  .hero-title { font-weight: var(--font-weight-semibold); font-size: var(--text-sm); color: var(--hero-foreground); }
  .hero-top .spacer { flex: 1; }
  .hero .live { color: var(--hero-muted); }
  .hero button.ghost { background: none; color: var(--hero-muted); border-color: var(--hero-border); box-shadow: none; font-size: var(--text-xs); padding: 0.25rem 0.625rem; }
  .hero button.ghost:hover { color: var(--hero-foreground); background: none; }
  .greet { margin: 1.25rem 0 0.5rem; color: var(--brand-amber); font-weight: var(--font-weight-semibold); font-size: var(--text-sm); letter-spacing: var(--tracking-wide); }
  .greet-date { color: var(--hero-muted); font-weight: var(--font-weight-normal); margin-left: 0.625rem; }
  .greet-date::before { content: "·"; margin-right: 0.625rem; }
  .display { font-size: var(--text-display); line-height: var(--text-display--line-height); letter-spacing: var(--tracking-display);
    font-weight: var(--font-weight-semibold); max-width: var(--measure); margin: 0; text-wrap: balance; }
  .hero-lead { color: var(--hero-muted); max-width: var(--measure); font-size: var(--text-base); line-height: var(--text-base--line-height); }
  .hero code { color: var(--hero-foreground); }
  .hero .src-chip { background: none; color: var(--hero-foreground); border-color: var(--hero-border); font-size: var(--text-sm); vertical-align: middle; letter-spacing: 0; }
  .run-pill { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.5rem; margin: 1rem 0 0; padding: 0.3125rem 0.875rem;
    border: 1px solid var(--hero-border); border-radius: var(--radius-full); color: var(--hero-muted); font-size: var(--text-xs); }
  .run-pill b { color: var(--hero-foreground); font-weight: var(--font-weight-semibold); }
  .run-pill a { color: var(--hero-muted); text-decoration: none; }
  .run-pill a:hover { color: var(--hero-foreground); }
  .run-pill .dot { color: var(--hero-muted); }
  .run-alert { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.5rem; max-width: var(--measure); margin: 0 0 1rem; padding: 0.5rem 0.875rem;
    border: 1px solid var(--brand-amber); border-radius: var(--radius-md); color: var(--hero-foreground); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
  .run-alert b { color: var(--brand-amber); font-weight: var(--font-weight-semibold); }
  .run-alert .dot { color: var(--hero-muted); }
  @media (max-width: 56.25rem) { .display { font-size: var(--text-3xl); line-height: var(--text-3xl--line-height); } }
  @media (max-width: 32.5rem) { .display { font-size: var(--text-2xl); line-height: var(--text-2xl--line-height); } .hero-in { padding: 0.75rem 1rem 1.25rem; } }

  /* sticky sub-nav under the hero */
  .subnav { position: sticky; top: 0; z-index: 5; background: var(--background); border-bottom: 1px solid var(--border); }
  .subnav-in { max-width: 73.75rem; margin: 0 auto; padding: 0 1.5rem; display: flex; overflow-x: auto; }
  .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; box-shadow: none;
    padding: 0.75rem 1rem; font-size: var(--text-sm); color: var(--muted-foreground); flex: none; min-height: 2.75rem; }
  .tab:hover { background: none; color: var(--foreground); }
  .tab:focus-visible, button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .tab[aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--brand-amber); font-weight: var(--font-weight-semibold); }
  [role="tabpanel"][hidden] { display: none; }

  /* Today */
  .today > * + * { margin-top: 1.75rem; }
  .sec-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 0.75rem; }
  .sec-head h2 { font-size: var(--text-lg); line-height: var(--text-lg--line-height); font-weight: var(--font-weight-semibold); letter-spacing: var(--tracking-tight); margin: 0; }
  .sec-head .count { font-size: var(--text-sm); color: var(--muted-foreground); margin-left: 0.25rem; }
  .sec-head > :last-child:not(h2) { margin-left: auto; }
  .more { font-size: var(--text-sm); text-decoration: none; }
  .quiet { color: var(--muted-foreground); margin: 0.75rem 0 0; font-size: var(--text-sm); }
  .lead { font-size: var(--text-lg); line-height: var(--text-lg--line-height); max-width: var(--measure); margin: 0 0 1rem; }
  button.ghost { background: none; box-shadow: none; }
  a.button { display: inline-flex; align-items: center; font-size: var(--text-sm); border-radius: var(--radius-md); padding: 0.375rem 0.75rem; text-decoration: none; }
  a.button.primary { background: var(--primary); color: var(--primary-foreground); }

  .act-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(17.5rem, 100%), 1fr)); }
  .act { display: flex; flex-direction: column; gap: 0.625rem; background: var(--card); color: var(--card-foreground); border: 1px solid var(--border);
    border-top: 0.25rem solid var(--verb-do); border-radius: var(--radius-xl); padding: 1rem 1.125rem; box-shadow: var(--shadow-sm); min-width: 0; }
  .act-decide { border-top-color: var(--brand-amber); }
  .act-delegate, .act-batch { border-top-color: var(--brand-blue); }
  .act header { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .act h3 { font-size: var(--text-base); line-height: var(--text-base--line-height); letter-spacing: var(--tracking-tight); text-transform: none;
    color: var(--card-foreground); font-weight: var(--font-weight-semibold); margin: 0; overflow-wrap: anywhere; }
  .verb { font-size: var(--text-xs); font-weight: var(--font-weight-bold); letter-spacing: var(--tracking-wide); text-transform: uppercase;
    border-radius: var(--radius-sm); padding: 0.0625rem 0.5rem; margin: 0; background: var(--verb-do); color: var(--verb-do-foreground); }
  .verb-decide { background: var(--brand-amber); color: var(--brand-ink); }
  .verb-delegate, .verb-batch { background: var(--brand-blue); color: var(--brand-ink); }
  .due { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--foreground); margin-left: auto; }
  .due.soft { color: var(--muted-foreground); }
  .why { margin: 0; color: var(--muted-foreground); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; cursor: pointer; }
  .why.open { display: block; }
  .next { margin: 0; }
  .next b { color: var(--brand-accent-text); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); margin-right: 0.25rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; }
  .src-chip, .chip-goal { display: inline-flex; align-items: center; gap: 0.3125rem; font-size: var(--text-xs); line-height: var(--text-xs--line-height);
    padding: 0.125rem 0.5rem; border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--secondary); color: var(--secondary-foreground);
    text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.src-chip:hover { border-color: var(--ring); }
  .chip-goal { background: var(--accent); color: var(--accent-foreground); border-color: transparent; }
  .chip-goal b { font-family: var(--font-mono); }
  .ic { width: var(--icon-xs); height: var(--icon-xs); flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .act footer { margin-top: auto; padding-top: 0.25rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
  .peek summary { cursor: pointer; color: var(--brand-text); font-size: var(--text-sm); }
  .peek pre { white-space: pre-wrap; margin: 0.5rem 0 0; padding: 0.625rem 0.75rem; background: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-xs); line-height: var(--text-xs--line-height); }
  .peek[open] { flex-basis: 100%; }

  .spaced-top { margin-top: 1rem; }
  #roadmap-card .diagram svg { max-height: 15rem; }
  .week, .ribbon, .changed { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 1.125rem 1.25rem; box-shadow: var(--shadow-sm); }
  ol.wk { list-style: none; margin: 0; padding: 0; }
  .wk-row { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto; gap: 0.75rem; align-items: start; padding: 0.75rem 0; border-top: 1px solid var(--border); }
  .conf { font-size: var(--text-lg); line-height: var(--text-lg--line-height); color: var(--brand-text); text-align: center; }
  .conf-water { color: var(--muted-foreground); }
  .wk-goal, .wk-next { margin: 0; }
  .wk-next { color: var(--muted-foreground); max-width: var(--measure); }
  .steer { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--brand-accent-text); font-weight: var(--font-weight-semibold); margin-left: 0.375rem; }
  .wk-more summary { cursor: pointer; font-size: var(--text-xs); color: var(--muted-foreground); margin-top: 0.25rem; }
  .wk-more dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.25rem 0.75rem; margin: 0.5rem 0 0; font-size: var(--text-sm); }
  .wk-more dt { color: var(--muted-foreground); }
  .wk-more dd { margin: 0; }
  .spark { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--muted-foreground); }
  .spark svg { display: block; overflow: visible; }
  .spark b { font-size: var(--text-lg); color: var(--foreground); font-weight: var(--font-weight-semibold); min-width: 1.5rem; }
  .wk-foot { display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
  .owe, .stop { position: relative; }
  .owe summary, .stop summary { list-style: none; cursor: pointer; font-size: var(--text-sm); border-radius: var(--radius-full); padding: 0.25rem 0.75rem; }
  .owe summary::-webkit-details-marker, .stop summary::-webkit-details-marker, .src summary::-webkit-details-marker { display: none; }
  .owe summary { background: var(--brand-amber); color: var(--brand-ink); font-weight: var(--font-weight-medium); }
  .owe-k { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); font-weight: var(--font-weight-bold); margin-right: 0.25rem; }
  .stop summary { border: 1px solid var(--border); color: var(--muted-foreground); }
  .owe[open], .stop[open] { flex-basis: 100%; }
  .owe p, .stop ul { margin: 0.5rem 0.75rem 0; max-width: var(--measure); }

  .rib { display: grid; gap: 0.375rem; }
  .rib-axis, .rib-row { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 0.75rem; align-items: center; }
  .rib-track { position: relative; height: 2.25rem; border-radius: var(--radius-md); background: var(--secondary); box-shadow: inset 0 0 0 1px var(--chart-grid); }
  .rib-axis .rib-track { height: 1rem; background: none; box-shadow: none; }
  .tick { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted-foreground); }
  .rib-day { font-size: var(--text-sm); color: var(--muted-foreground); display: flex; flex-wrap: wrap; gap: 0.25rem; align-items: center; }
  .is-today .rib-day { color: var(--foreground); font-weight: var(--font-weight-semibold); }
  .rib-day small { font-weight: var(--font-weight-normal); color: var(--muted-foreground); font-size: var(--text-xs); }
  .is-today .rib-track { background: var(--accent); }
  .blk { position: absolute; top: 0.25rem; bottom: 0.25rem; border-radius: var(--radius-sm); background: var(--chart-1); color: var(--primary-foreground);
    font-size: var(--text-xs); padding: 0 0.375rem; display: flex; align-items: center; overflow: hidden; white-space: nowrap; min-width: 0.25rem; }
  .blk span { overflow: hidden; text-overflow: ellipsis; }
  .blk.past { opacity: 0.35; }
  .now { position: absolute; top: -0.25rem; bottom: -0.25rem; width: 2px; background: var(--destructive); border-radius: var(--radius-full); }
  .flag { display: inline-flex; align-items: center; gap: 0.25rem; font-size: var(--text-xs); font-weight: var(--font-weight-semibold);
    padding: 0 0.5rem; border-radius: var(--radius-sm); background: var(--brand-amber); color: var(--brand-ink); }
  .flag::before { content: "⚑"; }
  .flag.soft { background: none; border: 1px solid var(--border); color: var(--foreground); font-weight: var(--font-weight-medium); }
  .flag small { color: var(--muted-foreground); font-weight: var(--font-weight-normal); }
  ul.prep { list-style: none; margin: 0.75rem 0 0; padding: 0; display: grid; gap: 0.25rem; max-width: var(--measure); }
  ul.prep .num { color: var(--brand-text); font-weight: var(--font-weight-semibold); margin-right: 0.25rem; }
  .later { display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; margin: 0.75rem 0 0; }
  .later-k, .cover-k { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--muted-foreground); margin-right: 0.25rem; }
  @media (max-width: 32.5rem) { .rib-axis, .rib-row { grid-template-columns: 4.5rem minmax(0, 1fr); } .tick:nth-child(even) { display: none; } }

  .changed ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; max-width: var(--measure); }
  .kind { font-size: var(--text-xs); font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: var(--tracking-wide); margin-right: 0.25rem; color: var(--success); }
  .kind-risk { color: var(--destructive); }
  .kind-time { color: var(--warning); }

  .cover { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .src { position: relative; font-size: var(--text-sm); }
  .src summary, span.src { display: inline-flex; align-items: center; gap: 0.375rem; list-style: none; cursor: pointer; padding: 0.1875rem 0.75rem;
    border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--card); }
  span.src { cursor: default; color: var(--muted-foreground); }
  .src small { color: var(--muted-foreground); font-size: var(--text-xs); }
  .src i { width: 0.5rem; height: 0.5rem; border-radius: var(--radius-full); background: var(--success); }
  .src-part i { background: var(--brand-amber); }
  .src-bad i { background: var(--destructive); }
  .src-gap i { background: none; border: 1px solid var(--chart-axis); }
  .src-pop { position: absolute; z-index: 4; top: calc(100% + 0.375rem); left: 0; width: min(22rem, 80vw); background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0.625rem 0.75rem; box-shadow: var(--shadow-md); }
  .src-pop p { margin: 0 0 0.25rem; }
  .gaps { margin-top: 0.375rem; }
  .detail > * + * { margin-top: 1rem; }

  /* Plan: one menu per row */
  .row-menu { position: relative; float: right; margin-left: 0.5rem; }
  .row-menu summary { list-style: none; cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 0.5rem; color: var(--muted-foreground); font-size: var(--text-base); line-height: var(--text-lg--line-height); }
  .row-menu summary::-webkit-details-marker { display: none; }
  .row-menu .menu { position: absolute; right: 0; z-index: 4; top: calc(100% + 0.25rem); display: grid; min-width: 13rem; background: var(--popover); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 0.25rem; box-shadow: var(--shadow-md); }
  .row-menu .menu button, .row-menu .menu a { text-align: left; border: 0; box-shadow: none; background: none; padding: 0.375rem 0.625rem; border-radius: var(--radius-sm); font-size: var(--text-sm); text-decoration: none; color: var(--popover-foreground); }
  .row-menu .menu button:hover, .row-menu .menu a:hover { background: var(--accent); }
  .meta-line { display: flex; flex-wrap: wrap; gap: 0.375rem 0.75rem; align-items: center; color: var(--muted-foreground); font-size: var(--text-sm); margin-top: 0.25rem; }

  /* motion: staggered entrance, nothing under reduced motion */
  @keyframes rise { from { opacity: 0; transform: translateY(0.5rem); } to { opacity: 1; transform: none; } }
  .act, .today > section, .today > p { animation: rise var(--motion-enter) var(--ease-out) both; }
  .act:nth-child(2) { animation-delay: var(--motion-step); }
  .act:nth-child(3) { animation-delay: calc(var(--motion-step) * 2); }
  .today > section:nth-child(n + 2) { animation-delay: calc(var(--motion-step) * 3); }
  @media (prefers-reduced-motion: reduce) {
    .act, .today > section, .today > p { animation: none; }
  }

  /* tiles */
  .tile .v { font-family: var(--font-mono); font-size: var(--text-2xl); line-height: var(--text-2xl--line-height); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; }
  .tile .l { color: var(--muted-foreground); font-size: var(--text-sm); }
  .headline { font-size: var(--text-base); line-height: var(--text-base--line-height); margin: 0; }

  /* lists */
  ol.actions { margin: 0; padding: 0; list-style: none; counter-reset: a; }
  ol.actions > li { counter-increment: a; padding: 0.875rem 0; border-top: 1px solid var(--border); }
  ol.actions > li:first-child { border-top: 0; }
  ol.actions > li::before { content: counter(a); float: left; width: 1.625rem; height: 1.625rem; border-radius: var(--radius-full);
    background: var(--primary); color: var(--primary-foreground); font-family: var(--font-mono); font-weight: var(--font-weight-semibold); font-size: var(--text-xs); text-align: center; line-height: 1.625rem; margin-right: 0.75rem; }
  .action-body { overflow: hidden; }
  .item { font-weight: var(--font-weight-semibold); }
  .prompt { margin-top: 0.5rem; }
  .prompt pre { white-space: pre-wrap; margin: 0.5rem 0 0; padding: 0.625rem 0.75rem; background: var(--muted);
    border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--text-xs); line-height: var(--text-xs--line-height); }
  .prompt summary { cursor: pointer; color: var(--brand-text); font-size: var(--text-sm); }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.375rem; }
  .row.between { justify-content: space-between; margin: 0 0 0.375rem; }
  .row.between h3 { margin: 0; }
  ul.plain { margin: 0; padding-left: 1.125rem; }
  ul.plain li { margin: 0.25rem 0; }
  .chip { display: inline-flex; align-items: center; gap: 0.3125rem; font-size: var(--text-xs); font-weight: var(--font-weight-semibold);
    border: 1px solid var(--chart-axis); border-radius: var(--radius-full); padding: 0 0.5625rem; margin-right: 0.5rem; }
  .gaps li { color: var(--muted-foreground); }
  .empty { color: var(--muted-foreground); padding: 0.75rem 0; }
  .ids { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .proposed { font-style: italic; color: var(--muted-foreground); }
  .goal-row { padding: 0.625rem 0; border-top: 1px solid var(--border); }
  .kpi { display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.375rem 0; border-top: 1px dashed var(--border); font-size: var(--text-sm); }
  .kpi b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .bar { height: 0.375rem; border-radius: var(--radius-full); background: var(--chart-grid); margin-top: 0.25rem; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--chart-1); }
  table.cov { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
  table.cov td, table.cov th { text-align: left; padding: 0.375rem 0.5rem 0.375rem 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.cov th { color: var(--muted-foreground); font-weight: var(--font-weight-medium); font-size: var(--text-xs); }
  .ok { color: var(--success); } .bad { color: var(--destructive); }
  .scroll { overflow-x: auto; }
  code { font-size: var(--text-xs); }

  /* charts */
  .chart svg { display: block; max-width: 100%; overflow: visible; }
  .chart .mark { cursor: default; }
  .chart .mark:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
  .axis-label { fill: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
  .value-label { fill: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 0.875rem; flex-wrap: wrap; font-size: var(--text-xs); color: var(--muted-foreground); margin: 0.375rem 0 0.5rem; }
  .legend i { display: inline-block; width: 0.625rem; height: 0.625rem; border-radius: var(--radius-sm); margin-right: 0.3125rem; vertical-align: -1px; }
  details.table { margin-top: 0.5rem; font-size: var(--text-xs); }
  details.table summary { cursor: pointer; color: var(--muted-foreground); }
  details.table table { border-collapse: collapse; margin-top: 0.375rem; width: 100%; }
  details.table td, details.table th { text-align: left; padding: 0.1875rem 0.5rem 0.1875rem 0; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .diagram svg { display: block; width: 100%; height: auto; max-height: 26.25rem; }
  .diagram .fallback { color: var(--muted-foreground); font-size: var(--text-xs); }
  .live { display: inline-flex; align-items: center; gap: 0.375rem; font-size: var(--text-xs); color: var(--muted-foreground); }
  .live i { width: 0.5rem; height: 0.5rem; border-radius: var(--radius-full); background: var(--success); }
  .heat rect.cell { rx: 2; }
  ul.archive { columns: 4 9.375rem; margin: 0; padding: 0; list-style: none; font-family: var(--font-mono); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
  ul.archive a { color: var(--brand-text); text-decoration: none; }
  ul.archive li { padding: 1px 0; }
  #tip { position: fixed; pointer-events: none; background: var(--foreground); color: var(--background);
    font-size: var(--text-xs); padding: 0.375rem 0.5625rem; border-radius: var(--radius-sm); max-width: 20rem; opacity: 0; transition: opacity .08s; z-index: 10; }
</style>
</head>
<body>
<header class="hero" id="hero">
  <svg class="hero-pattern" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="rings" width="64" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
        <g transform="translate(8 6) scale(1.6)">
          <path d="M16.98 7.82A6.5 6.5 0 1 0 16.98 16.18" fill="none" stroke="var(--brand-white)" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="18.4" cy="12" r="1.7" fill="var(--brand-amber)"/>
        </g>
      </pattern>
      <linearGradient id="rings-fade" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0.35" stop-color="var(--brand-white)" stop-opacity="0"/>
        <stop offset="1" stop-color="var(--brand-white)" stop-opacity="1"/>
      </linearGradient>
      <mask id="rings-mask"><rect width="100%" height="100%" fill="url(#rings-fade)"/></mask>
    </defs>
    <rect width="100%" height="100%" fill="url(#rings)" mask="url(#rings-mask)" opacity="0.09"/>
  </svg>
  <div class="hero-in">
    <div class="hero-top">
      <!--__COS_MARK__-->
      <span class="hero-title" id="title"><!--__COS_TITLE__--></span>
      <span class="spacer"></span>
      <span id="live-slot"></span>
      <button id="theme" class="ghost" type="button">Theme: auto</button>
    </div>
    <!--__COS_HERO__-->
  </div>
</header>

<nav class="subnav" aria-label="Report sections">
  <div class="subnav-in" role="tablist">
    <button class="tab" role="tab" id="tab-left" aria-controls="left" aria-selected="true">Brief</button>
    <button class="tab" role="tab" id="tab-plan" aria-controls="plan" aria-selected="false">Plan</button>
    <button class="tab" role="tab" id="tab-right" aria-controls="right" aria-selected="false">Steering</button>
    <button class="tab" role="tab" id="tab-history" aria-controls="history" aria-selected="false">History</button>
  </div>
</nav>

<main>
  <div role="tabpanel" id="left" aria-labelledby="tab-left"><!--__COS_TODAY__--></div>
  <div role="tabpanel" id="plan" aria-labelledby="tab-plan" hidden></div>
  <div role="tabpanel" id="right" aria-labelledby="tab-right" hidden></div>
  <div role="tabpanel" id="history" aria-labelledby="tab-history" hidden></div>
</main>
<div id="tip" role="tooltip"></div>

<script>/*__MARKDY__*/</script>
<script>
const DATA = "__COS_DATA__";

(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const human = (value) => String(value ?? "unknown").replaceAll("_", " ");
  const brief = DATA.brief && DATA.brief.report;
  const week = brief && brief.week && (brief.week.summary || (brief.week.goals || []).length || (brief.week.proposed || []).length) ? brief.week : null;
  const facts = DATA.facts;
  const workspace = DATA.workspace;
  const savedRuns = workspace && !workspace.error ? workspace.runs || [] : [];
  const latestSaved = savedRuns.at(-1);
  const savedWeekly = [...savedRuns].reverse().find((r) => r.strategicReview);
  const savedAssessment = [...savedRuns].reverse().find((r) => r.mode !== "publication_receipt") || latestSaved;
  const savedTime = (at) => {
    if (!at) return "not recorded";
    const date = new Date(at);
    return Number.isNaN(date.getTime()) ? String(at) : new Intl.DateTimeFormat("en-GB", {
      timeZone: workspace.timezone || "UTC", dateStyle: "medium", timeStyle: "short",
    }).format(date) + ` ${workspace.timezone || "UTC"}`;
  };
  const savedChanges = latestSaved && latestSaved.verifiedChanges || [];
  // Dates in words, in the profile's timezone: "Thu 29 Oct", "Thu 29 Oct, 16:00".
  const TZ = (workspace && workspace.timezone) || undefined;
  const dayKey = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const when = (v) => {
    if (!v) return "";
    const s = String(v);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
      if (s === DATA.today) return "today";
      return new Intl.DateTimeFormat("en-GB", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short" }).format(new Date(s + "T00:00:00Z"));
    }
    const d = new Date(s);
    if (Number.isNaN(d.getTime())) return s;
    const time = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }).format(d);
    if (dayKey(d) === dayKey(new Date())) return `today, ${time}`;
    return new Intl.DateTimeFormat("en-GB", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" }).format(d) + `, ${time}`;
  };
  // A source as a compact chip: repo#n for GitHub, the key for Jira, the host otherwise.
  const srcChip = (s) => {
    const t = String(s || "").trim();
    if (!t) return "";
    const m = /^https?:\/\/[^\s"'<>]+$/.test(t) && t.match(/^https?:\/\/([^/]+)\/?(.*)$/);
    if (!m) return `<span class="src-chip" title="${esc(t)}">${esc(t.length > 40 ? t.slice(0, 39) + "…" : t)}</span>`;
    const [, host, path] = m;
    const gh = host === "github.com" && path.match(/^[^/]+\/([^/]+)\/(?:pull|issues)\/(\d+)/);
    const jira = path.match(/browse\/([A-Z][A-Z0-9]*-\d+)/);
    const label = gh ? `${gh[1]}#${gh[2]}` : jira ? jira[1] : host.replace(/^www\./, "");
    return `<a class="src-chip" href="${esc(t)}" title="${esc(t)}" rel="noreferrer noopener" target="_blank">${esc(label)}</a>`;
  };
  const themes = ["auto", "light", "dark"];
  const stored = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  let theme = stored("cos-theme") || "auto";
  const applyTheme = () => {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.dataset.theme = theme;
    $("theme").textContent = `Theme: ${theme}`;
  };
  $("theme").onclick = () => {
    theme = themes[(themes.indexOf(theme) + 1) % 3];
    try { localStorage.setItem("cos-theme", theme); } catch { /* storage off */ }
    applyTheme();
  };
  applyTheme();

  // ---- tabs (hash deep links; #brief and #steering name the same panels)
  const tabs = [$("tab-left"), $("tab-plan"), $("tab-right"), $("tab-history")];
  const ALIAS = { brief: "left", today: "left", steering: "right" };
  // In the desktop window the report is a sandboxed frame the app reloads;
  // the app keeps the tab and scroll for it, since the frame has no storage.
  const framed = window.parent !== window;
  const tellHost = (msg) => { if (framed) window.parent.postMessage(msg, "*"); };
  const current = () => tabs.find((t) => t.getAttribute("aria-selected") === "true").getAttribute("aria-controls");
  const select = (t) => {
    for (const x of tabs) {
      const on = x === t;
      x.setAttribute("aria-selected", String(on));
      $(x.getAttribute("aria-controls")).hidden = !on;
      if (on) {
        history.replaceState(null, "", location.search + "#" + x.getAttribute("aria-controls"));
        try { localStorage.setItem("cos-tab", x.getAttribute("aria-controls")); } catch { /* storage off */ }
      }
    }
    tellHost({ type: "cos-report-state", tab: current(), y: scrollY });
    redraw();
  };
  tabs.forEach((t) => t.onclick = () => select(t));
  tabs.forEach((t, i) => t.addEventListener("keydown", (e) => {
    const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!step) return;
    const next = tabs[(i + step + tabs.length) % tabs.length];
    next.focus(); select(next);
  }));
  let scrollTimer;
  addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => tellHost({ type: "cos-report-state", tab: current(), y: scrollY }), 200);
  }, { passive: true });

  // ---- the host: the desktop app says it can hire; Hire then opens its dialog
  let canHire = false;
  addEventListener("message", (e) => {
    if (e.source !== window.parent || e.data?.type !== "cos-host") return;
    canHire = Boolean(e.data.hire);
    for (const b of document.querySelectorAll("[data-hire]")) b.textContent = canHire ? "Hire" : "Copy prompt";
  });
  tellHost({ type: "cos-report-ready" });

  // ---- copy
  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    const old = btn.textContent; btn.textContent = "Copied ✓"; btn.classList.add("done");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
  }
  document.addEventListener("click", (e) => {
    const why = e.target.closest(".why");
    if (why) { why.classList.toggle("open"); return; }
    const b = e.target.closest("[data-copy]");
    if (!b) return;
    if (canHire && b.dataset.hire) { tellHost({ type: "cos-hire", brief: Number(b.dataset.hire) }); return; }
    copy(PROMPTS[b.dataset.copy] ?? $("prompt-" + b.dataset.copy)?.textContent ?? "", b);
  });
  document.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("why")) { e.preventDefault(); e.target.classList.toggle("open"); }
  });
  // Links in the data are shown as text unless they are plain http(s) URLs.
  const link = (s) => /^https?:\/\/[^\s"'<>]+$/.test(String(s || "").trim())
    ? `<a href="${esc(s.trim())}" rel="noreferrer noopener" target="_blank">${esc(s.trim())}</a>` : esc(s);
  const PROMPTS = {};
  let promptSeq = 0;
  const promptBlock = (text, label = "Agent prompt") => {
    if (!text) return "";
    const id = `p${promptSeq++}`;
    PROMPTS[id] = text;
    return `<div class="prompt"><div class="row"><button type="button" data-copy="${id}">Copy prompt</button>
      <details><summary>${esc(label)}</summary><pre>${esc(text)}</pre></details></div></div>`;
  };

  // ---- tooltip (hover and keyboard focus show the same thing)
  const tip = $("tip");
  const showTip = (el, x, y) => { tip.textContent = el.dataset.tip; tip.style.opacity = 1;
    tip.style.left = Math.min(x + 12, innerWidth - 330) + "px"; tip.style.top = (y + 12) + "px"; };
  document.addEventListener("mousemove", (e) => {
    const m = e.target.closest("[data-tip]");
    if (m) showTip(m, e.clientX, e.clientY); else tip.style.opacity = 0;
  });
  document.addEventListener("focusin", (e) => {
    const m = e.target.closest("[data-tip]");
    if (!m) return; const r = m.getBoundingClientRect(); showTip(m, r.right, r.top);
  });
  document.addEventListener("focusout", () => { tip.style.opacity = 0; });

  // ---- chart primitives (SVG, thin marks, 2px gaps, recessive grid)
  // Drawn 1:1 at the container's pixel width, so text never scales with the
  // card. A hidden tab measures 0 wide; its charts redraw when shown.
  const widthOf = (el) => Math.max(200, el.clientWidth || 520);
  const svgOpen = (W, H) => `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  const clip = (s) => s.length > 26 ? s.slice(0, 25) + "…" : s;
  const charts = [];
  const chart = (el, draw) => { charts.push([el, draw]); draw(); };
  const redraw = () => charts.forEach(([el, draw]) => { if (el.offsetParent) draw(); });
  let resizeTimer;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(redraw, 120); });
  const tableView = (head, rows) => `<details class="table"><summary>Table view</summary><table>
    <tr>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>
    ${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></details>`;
  // Round steps (1, 2, 5 × 10ⁿ), at most 5 intervals, so ticks read 0 10 20 30.
  const stepFor = (v) => { for (let p = 1; ; p *= 10) for (const m of [1, 2, 5]) if (v / (m * p) <= 5) return m * p; };
  const niceMax = (v) => { const s = stepFor(Math.max(1, v)); return Math.ceil(Math.max(1, v) / s) * s; };
  const ticks = (max) => { const s = stepFor(max); return Array.from({ length: Math.round(max / s) + 1 }, (_, i) => i * s); };
  // A bar whose data-end is rounded 4px and whose base sits square on the baseline.
  const barPath = (x, y, w, h, horizontal) => {
    const r = Math.min(4, (horizontal ? h : w) / 2, horizontal ? w : h);
    if (h <= 0 || w <= 0) return "";
    return horizontal
      ? `M${x},${y} h${w - r} q${r},0 ${r},${r} v${h - 2 * r} q0,${r} ${-r},${r} h${-(w - r)} z`
      : `M${x},${y + h} v${-(h - r)} q0,${-r} ${r},${-r} h${w - 2 * r} q${r},0 ${r},${r} v${h - r} z`;
  };

  function columns(el, items, { color = "var(--chart-1)", unit = "" } = {}) {
    const W = widthOf(el), H = 140, L = 26, B = 22, T = 8;
    const max = niceMax(Math.max(1, ...items.map((d) => d.v)));
    const bw = (W - L) / items.length;
    let s = svgOpen(W, H + B);
    for (const t of ticks(max)) {
      const y = T + H - (H - T) * t / max;
      s += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"/>`;
      s += `<text class="axis-label" x="${L - 6}" y="${y + 4}" text-anchor="end">${t}</text>`;
    }
    items.forEach((d, i) => {
      const w = Math.max(2, Math.min(36, bw - 4)), h = (H - T) * d.v / max, x = L + i * bw + (bw - w) / 2;
      s += `<path class="mark" tabindex="0" d="${barPath(x, T + H - h, w, h, false)}" fill="${color}"
        data-tip="${esc(d.label)}: ${d.v}${unit}${d.note ? " · " + esc(d.note) : ""}"/>`;
      s += `<rect class="mark" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T}" fill="transparent"
        data-tip="${esc(d.label)}: ${d.v}${unit}${d.note ? " · " + esc(d.note) : ""}"/>`;
      s += `<text class="axis-label" x="${x + w / 2}" y="${H + 16}" text-anchor="middle">${esc(d.short || d.label)}</text>`;
    });
    s += `<line x1="${L}" x2="${W}" y1="${T + H}" y2="${T + H}" stroke="var(--chart-axis)"/></svg>`;
    el.innerHTML = s + tableView(["", "count"], items.map((d) => [d.label, d.v]));
  }

  function hbars(el, items, { color = "var(--chart-1)" } = {}) {
    if (!items.length) { el.innerHTML = `<p class="empty">Nothing to chart.</p>`; return; }
    const W = widthOf(el), rowH = 24, L = 170, R = 28;
    const H = items.length * rowH;
    const max = niceMax(Math.max(1, ...items.map((d) => d.v)));
    let s = svgOpen(W, H + 4);
    items.forEach((d, i) => {
      const y = i * rowH + 3, w = (W - L - R) * d.v / max;
      s += `<text class="axis-label" x="${L - 8}" y="${y + 13}" text-anchor="end">${esc(clip(d.label))}</text>`;
      s += `<path class="mark" tabindex="0" d="${barPath(L, y, Math.max(w, 2), rowH - 8, true)}" fill="${color}" data-tip="${esc(d.label)}: ${d.v}"/>`;
      s += `<text class="value-label" x="${L + w + 6}" y="${y + 13}">${d.v}</text>`;
    });
    s += `<line x1="${L}" x2="${L}" y1="0" y2="${H}" stroke="var(--chart-axis)"/></svg>`;
    el.innerHTML = s + tableView(["", "count"], items.map((d) => [d.label, d.v]));
  }

  // Stacked horizontal bars; `keys` are ordered (an ordinal ramp, not identity).
  function stacked(el, rows, keys, colors) {
    if (!rows.length) { el.innerHTML = `<p class="empty">Nothing to chart.</p>`; return; }
    const W = widthOf(el), rowH = 24, L = 170, R = 30;
    const H = rows.length * rowH;
    const max = niceMax(Math.max(1, ...rows.map((r) => keys.reduce((a, k) => a + (r[k] || 0), 0))));
    let s = svgOpen(W, H + 4);
    rows.forEach((r, i) => {
      const y = i * rowH + 3; let x = L; const total = keys.reduce((a, k) => a + (r[k] || 0), 0);
      s += `<text class="axis-label" x="${L - 8}" y="${y + 13}" text-anchor="end" data-tip="${esc(r.label)}">${esc(clip(r.label))}</text>`;
      keys.forEach((k, ki) => {
        const v = r[k] || 0; if (!v) return;
        const w = (W - L - R) * v / max;
        const last = !keys.slice(ki + 1).some((kk) => r[kk]);
        const d = last ? barPath(x, y, Math.max(w - 2, 2), rowH - 8, true) : `M${x},${y} h${Math.max(w - 2, 1)} v${rowH - 8} h${-Math.max(w - 2, 1)} z`;
        s += `<path class="mark" tabindex="0" d="${d}" fill="${colors[ki]}" data-tip="${esc(r.label)} · ${k}: ${v}"/>`;
        x += w;
      });
      s += `<text class="value-label" x="${x + 4}" y="${y + 13}">${total}</text>`;
    });
    s += `<line x1="${L}" x2="${L}" y1="0" y2="${H}" stroke="var(--chart-axis)"/></svg>`;
    const legend = `<div class="legend">${keys.map((k, i) => `<span><i style="background:${colors[i]}"></i>${k}</span>`).join("")}</div>`;
    el.innerHTML = legend + s + tableView(["repo", ...keys, "total"], rows.map((r) => [r.label, ...keys.map((k) => r[k] || 0), keys.reduce((a, k) => a + (r[k] || 0), 0)]));
  }

  // ---- derived numbers (from facts, never from the model)
  const daysAgo = (iso) => (Date.now() - Date.parse(iso)) / 864e5;
  // Local calendar date; toISOString() is UTC and shifts evening days back one.
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const merged = (facts && facts.merged) || [];
  // "Shipped" counts only the orgs the profile names as work (`orgs` on the
  // code source); with none named, every org counts.
  const workOrgs = (DATA.work_orgs || []).map((o) => o.toLowerCase());
  const inWork = (repo) => !workOrgs.length || workOrgs.includes(String(repo).split("/")[0].toLowerCase());
  const shipped = merged.filter((p) => inWork(p.repo));
  const workLabel = (DATA.work_orgs || []).join(", ");
  if (workLabel && $("chart-merged")) $("chart-merged").previousElementSibling.textContent = `Shipped to ${workLabel}, last 7 days`;
  const reviewQ = (facts && facts.review_requested) || [];
  const tasks = (facts && facts.tasks) || [];

  if ($("wins")) {
    // ---- what changed: verified deltas from the brief
    const KIND = { done: ["✓", "DONE"], unblocked: ["↗", "UNBLOCKED"], risk: ["!", "RISK"], time_changed: ["↻", "TIME CHANGED"] };
    const changes = (brief && brief.what_changed) || [];
    $("wins").innerHTML = savedRuns.length
      ? savedChanges.map((c) => `<li><b>${esc(human(c.boundary || "verified change"))}</b> ${esc(c.summary)}<div class="ids">${link(c.reference)}${c.commit ? ` · ${esc(c.commit.slice(0, 9))}` : ""}</div></li>`).join("") || `<li class="empty">Latest assessment records no new verified changes.</li>`
      : changes.length
      ? changes.map((c) => { const [m, l] = KIND[c.kind] || ["•", c.kind];
          return `<li><span class="mark${c.kind === "risk" ? " bad" : ""}">${m}</span><b>${esc(l)}</b> ${esc(c.what)}<div class="muted small">${link(c.source)}</div></li>`; }).join("")
      : (shipped.length ? `<li class="muted small">Merged this week${workLabel ? ` in ${esc(workLabel)}` : ", all repos"}. A brief names the changes that matter.</li>` : "") +
        shipped.slice(0, 5).map((p) => `<li><span class="mark">✓</span><b>${esc(p.repo)}#${p.number}</b> ${esc(p.title)}</li>`).join("") || `<li class="empty">Nothing verified yet. Run <code>cos brief</code>.</li>`;
  
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
    const key = ymd;
    const byDay = Object.fromEntries(days.map((d) => [key(d), []]));
    shipped.forEach((p) => { const k = (p.closed || p.updated || "").slice(0, 10); if (byDay[k]) byDay[k].push(p); });
    if (savedRuns.length) {
      const diagnosis = (workspace.deliverables || []).find((d) => d.readinessEvidence)?.readinessEvidence.visibilityDiagnosis;
      $("chart-merged").parentElement.innerHTML = `<h3>Delivery evidence</h3>${diagnosis ? `<p>Source repair: <b>${esc(human(diagnosis.sourceRepair))}</b></p><p>PR gates: <b>${esc(human(diagnosis.gateStatus || "unverified"))}</b></p><p>Release: <b>${diagnosis.releaseVerified === true ? "verified" : "unverified"}</b> · installed verification: <b>${diagnosis.installedVerified === true ? "verified" : "open"}</b></p><div class="ids">${link(diagnosis.pullRequest)}</div>` : `<p class="empty">Delivery evidence not recorded.</p>`}`;
    } else chart($("chart-merged"), () => columns($("chart-merged"), days.map((d) => {
      const ps = byDay[key(d)];
      return { label: d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" }), short: d.toLocaleDateString(undefined, { weekday: "short" }),
        v: ps.length, note: ps.slice(0, 3).map((p) => `${p.repo.split("/")[1]}#${p.number}`).join(", ") };
    }), { unit: " merged" }));
  
    const soon = [...((brief && brief.upcoming) || [])]
      .filter((m, i, a) => a.findIndex((n) => n.date === m.date && n.what === m.what) === i)
      .sort((a, b) => a.date.localeCompare(b.date));
    $("soon").innerHTML = soon.length
      ? soon.map((m) => { const d = Math.round((Date.parse(m.date) - Date.parse(DATA.today)) / 864e5);
          return `<li><span class="date">${esc(m.date)}</span>${esc(m.what)}<div class="countdown">${d === 0 ? "today" : d > 0 ? `in ${d} day${d > 1 ? "s" : ""}` : `${-d} days ago`} · ${esc(m.source)}</div></li>`; }).join("")
      : `<li class="empty">No dated milestones yet. Add dates to context/goals.md.</li>`;
    if (savedRuns.length) $("soon").innerHTML = `<li>${esc(workspace.schedule?.cadence || "Assessment cadence not recorded")}</li>` + (workspace.goals || []).filter((g) => g.status === "active" && g.targetDate).map((g) => `<li><span class="date">${esc(g.targetDate)}</span>${esc(g.title)}<div class="countdown">Outcome horizon · ${esc(g.priority || "active")}</div></li>`).join("");
  }

  // ---- left brain: tactician
  const list = (items, fn, cls = "plain") => items && items.length ? `<ul class="${cls}">${items.map((x) => `<li>${fn(x)}</li>`).join("")}</ul>` : `<p class="empty">None.</p>`;
  const tile = (v, l) => `<div class="card tile"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`;

  const savedCoverage = (sources) => `<section class="card"><h3>Evidence coverage</h3>${list(sources, (s) => `<b>${esc(s.id || s.source)}</b> · ${esc(s.health)} · ${esc(s.review)}<div class="sub">Checked ${esc(savedTime(s.checkedAt))}</div><p>${esc(s.note)}</p>`)}</section>`;
  const savedReadiness = () => (workspace.deliverables || []).filter((d) => d.readinessEvidence && !["complete", "cancelled", "retired"].includes(d.status)).map((d) => {
    const e = d.readinessEvidence, v = e.visibilityDiagnosis || {};
    return `<section class="card" data-readiness="${esc(d.id)}"><h3>${esc(d.title)} · readiness</h3><p class="headline">${esc(d.status)} · customer acceptance ${d.completionEvidence ? "recorded" : "unverified"}</p>
      <p>Participant: <b>${esc(d.customerIdentity || "not selected")}</b> · customer team: <b>${esc(d.dashboardTeam || "not selected")}</b></p>
      <p>Saved producer: ${esc(e.skill?.slug)} ${esc(e.skill?.version)} · ${esc(e.workflow?.slug)} ${esc(e.workflow?.version)}</p>
      <p class="sub">Producer observed ${esc(savedTime(e.checkedAt))}; no fresh customer runtime read. Required sources: ${(e.skill?.required || []).map(esc).join(", ") || "not recorded"}. Supplemental: ${(e.skill?.supplemental || []).map(esc).join(", ") || "none recorded"}.</p>
      <p>Repair ${esc(human(v.sourceRepair))} · PR gates ${esc(human(v.gateStatus || "unverified"))} · release ${v.releaseVerified === true ? "verified" : "unverified"} · installed verification ${v.installedVerified === true ? "verified" : "open"}.</p>
      <p class="ids">${link(v.pullRequest || d.source)}${v.repairCommit ? ` · ${esc(v.repairCommit.slice(0, 9))}` : ""}</p>
      <h3>Acceptance evidence</h3>${list(d.evidenceGates, (g) => `<b>${esc(g.id.replaceAll("-", " "))}</b> · ${esc(g.status)}${g.reference ? `<div class="ids">${link(g.reference)}</div>` : ""}`)}
      <h3>Blockers and next actions</h3>${list((d.readinessBlockers || []).filter((b) => !["complete", "resolved", "retired", "cancelled"].includes(b.status)), (b) => `<b>${esc(b.id)} · ${esc(b.summary)}</b><p><b>Next:</b> ${esc(b.nextAction)}</p><div class="sub">${esc(b.owner || "owner unassigned")} · ${esc(b.status)} · ${link(d.source)}</div>`)}
      <details><summary>Customer proof finish line</summary><p>${esc(d.doneWhen)}</p></details></section>`;
  }).join("");

  // The Brief panel is rendered with the page (src/today.rs); here it only
  // gets its charts. Without a brief, the saved views and the facts fill it.
  const ssr = document.querySelector("#left [data-ssr]");
  const leftBody = $("left-body");
  if (ssr) {
    const actions = brief.needs_you || [];
    const allPrompts = actions.filter((a) => a.agent_prompt).map((a, i) => `## ${i + 1}. ${a.recommendation}\n\n${a.agent_prompt}`).join("\n\n");
    if (allPrompts) PROMPTS.all = allPrompts;

    const age = [["≤ 2 days", 0, 2], ["3–7 days", 2, 7], ["8–30 days", 7, 30], ["> 30 days", 30, 1e9]]
      .map(([label, a, b]) => { const ps = reviewQ.filter((p) => { const d = daysAgo(p.updated); return d > a - (a === 0 ? 1 : 0) && d <= b; });
        return { label, v: ps.length, note: ps.slice(0, 3).map((p) => `${p.repo.split("/")[1]}#${p.number}`).join(", ") }; });

    const prios = ["p0", "p1", "p2", "p3"];
    const byRepo = {};
    tasks.forEach((t) => { const r = (byRepo[t.repo] ||= { label: t.repo }); r[t.priority] = (r[t.priority] || 0) + 1; });
    const repoRows = Object.values(byRepo).sort((a, b) => prios.reduce((s, k) => s + (b[k] || 0), 0) - prios.reduce((s, k) => s + (a[k] || 0), 0));
    chart($("chart-age"), () => columns($("chart-age"), age, { unit: " PRs" }));
    chart($("chart-tasks"), () => stacked($("chart-tasks"), repoRows, prios, ["var(--ramp-4)", "var(--ramp-3)", "var(--ramp-2)", "var(--ramp-1)"]));
  } else if (latestSaved) {
    leftBody.innerHTML = `<section class="card"><h3>Latest saved assessment</h3><p>Assessment ${esc(savedTime(savedAssessment.finishedAt || savedAssessment.invokedAt))} · ${esc(savedAssessment.status)} coverage.</p><p>Latest evidence update ${esc(savedTime(latestSaved.finishedAt || latestSaved.invokedAt))} · ${esc(human(latestSaved.mode))}.</p><p class="sub">Saved assessments from this chat; no additional model run. Unknown outcome readings remain unknown.</p></section>${savedReadiness()}${savedCoverage(workspace.sources || [])}`;
  } else if (!brief) {
    leftBody.innerHTML = `<section class="card"><p class="empty">No brief saved yet.</p>${promptBlock("cos brief", "Command")}</section>`;
  } else {
    leftBody.innerHTML = `<p class="quiet">The saved brief could not be read. Run <code>cos brief</code> for a new one.</p>`;
  }

  // ---- steering: the brief's week part
  const glyph = { rock: "●", sand: "◐", water: "○" };
  // One overflow menu per row instead of a button per action.
  const rowMenu = (items) => {
    const kept = items.filter(Boolean);
    return kept.length ? `<details class="row-menu"><summary aria-label="More actions">⋯</summary><div class="menu">${kept.join("")}</div></details>` : "";
  };
  const menuCopy = (text, label = "Copy handoff") => {
    if (!text) return "";
    const id = `p${promptSeq++}`;
    PROMPTS[id] = text;
    return `<button type="button" data-copy="${id}">${esc(label)}</button>`;
  };
  const menuOpen = (s) => /^https?:\/\/[^\s"'<>]+$/.test(String(s || "").trim())
    ? `<a href="${esc(s.trim())}" target="_blank" rel="noreferrer noopener">Open source</a>` : "";
  const weekView = () => {
    const goals = week.goals || [];
    const count = (c) => goals.filter((g) => g.confidence === c).length;
    const orgs = {};
    merged.forEach((p) => { const o = p.repo.split("/")[0]; orgs[o] = (orgs[o] || 0) + 1; });
    $("right").innerHTML = `
      <section class="grid g4">
        ${tile(`${glyph.rock} <span data-count>${count("rock")}</span>`, "rock · bet it")}
        ${tile(`${glyph.sand} <span data-count>${count("sand")}</span>`, "sand · shape first")}
        ${tile(`${glyph.water} <span data-count>${count("water")}</span>`, "water · spike first")}
        ${tile(`<span data-count>${(week.decisions || []).length}</span>`, "decisions only you can take")}
      </section>
      ${week.summary ? `<p class="lead spaced-top">${esc(week.summary)}</p>` : ""}
      <section class="week" id="steer-goals"><div class="sec-head"><h2>Goals this week</h2></div></section>
      <section class="card"><h3>Proposed this week · proposals, not commitments</h3>
        ${list(week.proposed, (p) => `${rowMenu([menuCopy("cos state propose", "Copy the command to save these as a candidate")])}<b>${esc(p.title)}</b> <span class="chip-goal"><b>${esc(p.goal_id)}</b></span>
          <div class="meta-line"><span>owner ${esc(p.owner || "unassigned")} <span class="proposed">(${esc(p.owner_basis)})</span></span><span>${p.due_date ? `${esc(when(p.due_date))} <span class="proposed">(${esc(p.due_basis)})</span>` : "no date"}</span></div>
          <div class="sub">Done when: ${esc(p.done_when)}</div>${p.blocker ? `<div class="sub">Blocker: ${esc(p.blocker)}</div>` : ""}`)}
      </section>
      <section class="grid g2">
        <div class="card"><h3>Where merged work went, last 7 days</h3><div class="chart" id="chart-orgs"></div></div>
        <div class="card"><h3>Decisions you owe</h3>${(week.decisions || []).length ? (week.decisions || []).map((d) => `<details class="owe" open><summary><span class="owe-k">You decide</span> ${esc(d.decision)}</summary><p>${(d.options || []).map(esc).join(" · ")}</p><p><b>Recommend</b> ${esc(d.recommendation)}</p></details>`).join("") : `<p class="empty">None.</p>`}</div>
      </section>
      <section class="card"><h3>Stop doing</h3>${list(week.stop_doing, esc)}</section>
      <section class="card"><h3>Goals flywheel</h3><div class="diagram" id="diagram-flywheel"></div></section>`;
    // The goal rows are the Brief tab's, sparklines included, plus a menu each.
    const rows = document.querySelector('#left [data-section="week"] ol.wk');
    if (rows) {
      const copy = rows.cloneNode(true);
      [...copy.children].forEach((li, i) => {
        const g = goals[i];
        const more = li.querySelector("details.wk-more");
        if (more) more.open = true;
        if (g && g.agent_prompt) li.querySelector(".wk-main").insertAdjacentHTML("afterbegin", rowMenu([menuCopy(g.agent_prompt)]));
      });
      $("steer-goals").append(copy);
    } else {
      $("steer-goals").insertAdjacentHTML("beforeend", list(goals, (g) => `<b>${glyph[g.confidence] || ""} ${esc(g.goal)}</b><div class="sub">${esc(g.next)}</div>`));
    }
    chart($("chart-orgs"), () => hbars($("chart-orgs"), Object.entries(orgs).sort((a, b) => b[1] - a[1]).map(([label, v]) => ({ label, v }))));
  };
  if (savedWeekly) {
    const s = savedWeekly.strategicReview;
    $("right").innerHTML = `<section class="card"><h3>Saved strategic review</h3><p class="sub">${esc(when(savedWeekly.finishedAt || savedWeekly.invokedAt))} · ${esc(s.window)}</p><p class="headline">${esc(s.recommendation)}</p><p>${esc(s.baselineLimit)}</p></section>
      <section class="card"><h3>Latest evidence since review</h3>${list(savedChanges, (c) => `${esc(c.summary)}<div class="chips">${esc(human(c.boundary))} ${srcChip(c.reference)}</div>`)}</section>
      <section class="card"><h3>Outcome evidence at review</h3>${list(Object.entries(s.goalEvidence || {}), ([goal, evidence]) => `<b>${esc(goal)}</b><p>${esc(evidence)}</p>`)}</section>
      <section class="card"><h3>Assumptions challenged</h3>${list(s.challengedAssumptions, esc)}</section>
      <section class="card"><h3>Proposed deliverables · not commitments</h3>${list(s.proposedDeliverables, (p) => `<b>${esc(p.title)}</b> · ${esc(p.status)}<p>${esc(p.doneWhen)}</p><div class="meta-line">${esc(p.ownerBasis || "unassigned")} · ${esc(p.confidence || "unknown")} ${srcChip(p.source)}</div>`)}</section>`;
  } else if (week) {
    weekView();
  } else if (latestSaved) {
    $("right").innerHTML = `<section class="card"><h3>Saved strategic review</h3><p>No strategic review recorded yet.</p><p>${esc(workspace.schedule?.weeklyReview || "Review cadence not recorded")}</p></section>`;
  } else {
    $("right").innerHTML = `<section class="card"><p class="empty">${brief ? "This brief has no week part. A new brief carries it:" : "No brief saved yet. Every brief carries this week against your goals:"}</p>${promptBlock("cos brief", "Command")}</section>
      <section class="card"><h3>Goals flywheel</h3><div class="diagram" id="diagram-flywheel"></div></section>`;
  }

  // Configured staff roles and their managed-run evidence (`cos staff-sync`).
  // A run reference counts as verified only with a receipt and a readback time.
  const staffCard = (staff) => {
    const members = staff.members || [];
    const followUps = staff.followUps || [];
    const verified = (m) => !!(m.run?.id && m.run?.receiptRef && m.run?.verifiedAt);
    const runtime = (m) => !m.run?.id ? "No linked run" : verified(m) ? `${human(m.run.status)} · ${m.run.host || "host unknown"}` : "Run reference; evidence missing";
    const waiting = followUps.filter((x) => ["awaiting_authority", "blocked", "outcome_unknown"].includes(x.disposition));
    const open = new Set(members.filter((m) => verified(m) && m.run.status === "active").map((m) => m.run.id)).size;
    return `<section class="card" data-staff><h3>Staff · mandates and managed runs</h3>${staff.purpose ? `<p>${esc(staff.purpose)}</p>` : ""}
      <p class="sub">${members.length} configured roles · ${open} open managed runs · ${waiting.length} follow-ups need attention. Configuration is not execution; a run reference is not a verified outcome.</p>
      <div class="scroll"><table class="cov"><tr><th>Role</th><th>Current follow-up</th><th>Execution proof</th></tr>${members.map((m) => {
        const item = followUps.find((x) => x.staffId === m.id);
        return `<tr><td><b>${esc(m.name || m.id)}</b><p>${esc(m.status)}</p></td><td>${esc(item?.title || "No follow-up assigned")}<p>${esc(item ? human(item.disposition) : "")}</p></td><td>${esc(runtime(m))}${m.run?.verifiedAt ? `<p class="sub">Evidence refreshed ${esc(savedTime(m.run.verifiedAt))}</p>` : ""}<div class="chips">${(item?.sources || []).map((s) => srcChip(s?.url || s?.label)).join("")}</div></td></tr>`;
      }).join("")}</table></div>${staff.reviewedAt ? `<p class="sub">Roster reviewed ${esc(savedTime(staff.reviewedAt))}.</p>` : ""}</section>`;
  };

  // ---- plan: the workspace state (.chief-of-staff/state.json)
  {
    const W = DATA.workspace;
    const TERM = ["complete", "cancelled", "retired"];
    if (!W) {
      $("plan").innerHTML = `<section class="card"><p class="empty">No workspace yet. Goals, KPIs and this week's deliverables live in
        <code>.chief-of-staff/</code>, created once and filled in with you, one question at a time.</p>
        ${promptBlock("cos state init", "Command: create the workspace")}
        ${promptBlock("Read plugins/chief-of-staff-starter/skills/chief-of-staff-starter/SKILL.md completely and use Setup mode for this project.", "Setup prompt for Claude Code or Codex")}</section>`;
    } else if (W.error) {
      $("plan").innerHTML = `<section class="card"><p class="empty">The workspace state did not validate, so none of it is shown: ${esc(W.error)}</p></section>`;
    } else {
      const goalsById = Object.fromEntries((W.goals || []).map((g) => [g.id, g]));
      const kpiLine = (k) => {
        const known = k.current != null;
        const pct = known && k.target ? Math.max(0, Math.min(100, ((k.current - (k.baseline || 0)) / ((k.target - (k.baseline || 0)) || 1)) * 100)) : null;
        return `<div class="kpi"><span>${esc(k.name)} <span class="muted">· ${esc(k.reportingWindow || "no window")}${k.evidenceAt ? " · " + esc(when(k.evidenceAt)) : ""}</span>
          ${pct != null ? `<div class="bar" role="img" aria-label="${Math.round(pct)}% of target"><i style="width:${pct}%"></i></div>` : ""}</span>
          <b>${known ? esc(k.current) : "unknown"} / ${esc(k.target ?? "?")} ${esc(k.unit)}${k.targetBasis === "proposed" || k.status === "proposed" ? " (proposed · later phase)" : ""}</b></div>`;
      };
      const openGoals = (W.goals || []).filter((g) => !TERM.includes(g.status));
      const items = (W.deliverables || []);
      const open = items.filter((d) => !TERM.includes(d.status));
      const done = items.filter((d) => TERM.includes(d.status));
      const due = (d) => d.dueDate ? `${esc(when(d.dueDate))} <span class="proposed">(${esc(d.dueBasis)})</span>` : "no date";
      const handoff = (d) => rowMenu([W.handoffs && W.handoffs[d.id] ? menuCopy(W.handoffs[d.id], "Copy handoff (draft-only, starts nothing)") : "", menuOpen(d.source)]);
      const commitments = (W.commitments || []).filter((c) => !TERM.includes(c.status));
      const incidents = (W.incidents || []).filter((i) => !i.resolvedAt);
      $("plan").innerHTML = `
        <section class="grid g4">
          ${tile(`<span data-count>${openGoals.length}</span>`, "goals in play")}
          ${tile(`<span data-count>${open.filter((d) => d.status !== "proposed").length}</span>`, "deliverables this week")}
          ${tile(`<span data-count>${open.filter((d) => d.status === "blocked" || d.blocker).length}</span>`, "blocked or with a blocker")}
          ${tile(`<span data-count>${commitments.length}</span>`, "open commitments")}
        </section>
        ${savedReadiness()}
        ${W.portfolio ? `<section class="card" data-portfolio><h3>Workstreams</h3><p>${esc(W.portfolio.summary)}</p><p class="sub">Reviewed ${esc(when(W.portfolio.assessedAt))}. ${esc(W.portfolio.coverage)}</p><div class="scroll"><table class="cov"><tr><th>Workstream</th><th>Evidence</th><th>Next proof</th></tr>${(W.portfolio.workstreams || []).map((x) => `<tr><td><b>${esc(x.name)}</b><p>${esc(x.status)}</p></td><td>${esc(x.evidence)}</td><td>${esc(x.nextAction)}<div class="chips">${srcChip(x.source)}</div></td></tr>`).join("")}</table></div><h3>Decisions and material risks</h3>${list(W.portfolio.decisions, (x) => `<b>${esc(x.title)}</b><p>${esc(x.nextAction)}</p><div class="chips">${srcChip(x.source)}</div>`)}<details><summary>Active work inventory · ${esc(W.portfolio.activeCount)} records</summary><p class="sub">Tracker status is bookkeeping. Rows are not new bets or accepted outcomes.</p><div class="scroll"><table class="cov"><tr><th>Work</th><th>Status</th><th>Priority</th><th>Owner</th></tr>${(W.portfolio.activeWork || []).map((x) => `<tr><td>${esc(x.title)}</td><td>${esc(x.status)}</td><td>${esc(x.priority)}</td><td>${esc(x.owner || "unassigned")}</td></tr>`).join("")}</table></div></details></section>` : ""}
        ${W.staff ? staffCard(W.staff) : ""}
        <section class="card"><h3>Goals · finish lines and KPIs</h3>
          ${openGoals.length ? openGoals.map((g) => `<div class="goal-row">
            <div><span class="ids">${esc(g.id)}</span> <span class="item">${esc(g.title)}</span> <span class="chip">${esc(g.status)}</span></div>
            <div class="sub">Finish line: ${esc(g.finishLine)}${g.targetDate ? ` · by ${esc(when(g.targetDate))}` : ""}${g.owner ? ` · ${esc(g.owner)}` : ""}</div>
            ${(W.kpis || []).filter((k) => k.goalId === g.id && !TERM.includes(k.status) && k.targetBasis !== "retired" && !k.excludeFromActiveScore && k.status !== "proposed" && k.targetBasis !== "proposed").map(kpiLine).join("") || `<div class="kpi"><span class="muted">No KPI yet: progress is unknown, not zero.</span></div>`}
            ${(W.kpis || []).some((k) => k.goalId === g.id && (k.status === "proposed" || k.targetBasis === "proposed")) ? `<details><summary>Later proposals · outside first proof</summary>${(W.kpis || []).filter((k) => k.goalId === g.id && (k.status === "proposed" || k.targetBasis === "proposed") && !TERM.includes(k.status) && !k.excludeFromActiveScore).map(kpiLine).join("")}</details>` : ""}
          </div>`).join("") : `<p class="empty">No confirmed goals.</p>`}
        </section>
        <section class="card"><h3>This week · deliverables</h3>
          ${open.length ? `<ol class="actions">${open.map((d) => `<li><div class="action-body">
            ${handoff(d)}<div><span class="ids">${esc(d.id)}</span> <span class="item${d.status === "proposed" ? " proposed" : ""}">${esc(d.title)}</span> <span class="chip">${esc(d.status)}</span></div>
            <div class="meta-line"><span class="chip-goal">${esc((goalsById[d.goalId] || {}).title || d.goalId)}</span><span>owner ${esc(d.owner || "unassigned")} <span class="proposed">(${esc(d.ownerBasis)})</span></span><span>${due(d)}</span>${srcChip(d.source)}</div>
            <div class="sub">Done when: ${esc(d.doneWhen)}</div>
            ${d.blocker ? `<div class="sub">Blocker: ${esc(d.blocker)}</div>` : ""}
            ${(d.dependencies || []).length ? `<div class="sub">Depends on: ${(d.dependencies || []).map(esc).join(", ")}</div>` : ""}
            ${d.meetingAt ? `<div class="sub muted">Meeting ${esc(when(d.meetingAt))} (the event, not a deadline)</div>` : ""}
            ${d.reviewedAt ? `<div class="sub muted">Reviewed ${esc(when(d.reviewedAt))}; still ${esc(d.status)}</div>` : ""}
            </div></li>`).join("")}</ol>` : `<p class="empty">Nothing planned for this week.</p>`}
          ${done.length ? `<details class="table"><summary>${done.length} completed, kept in history</summary><ul class="plain">${done.map((d) => `<li>${esc(d.id)} ${esc(d.title)} · <span class="muted">${esc(d.status)}</span> ${srcChip((d.completionEvidence || {}).reference)}</li>`).join("")}</ul></details>` : ""}
        </section>
        <section class="card" id="roadmap-card" hidden><h3>Roadmap</h3><div class="diagram" id="diagram-timeline"></div></section>
        <section class="grid g2">
          <div class="card"><h3>Commitments · waiting and follow-ups</h3>${list(commitments, (c) => `<b>${esc(c.title)}</b> <span class="chip">${esc(c.status)}</span>
            <div class="sub">${esc(c.owner || "")}${c.dueDate ? ` · due ${esc(when(c.dueDate))}` : ""} · next review: ${esc(c.nextReview)}</div>
            ${c.meetingAt ? `<div class="sub muted">Meeting ${esc(when(c.meetingAt))}</div>` : ""}${c.source ? `<div class="chips">${srcChip(c.source)}</div>` : ""}`)}</div>
          <div class="card"><h3>Sources · connection vs coverage</h3>
            ${(W.sources || []).length ? `<div class="scroll"><table class="cov"><tr><th>source</th><th>connection</th><th>review</th><th>complete through</th></tr>
              ${(W.sources || []).map((s) => `<tr><td>${esc(s.id)}<div class="muted small">${esc(s.note || "")}</div></td>
                <td class="${s.health === "healthy" ? "ok" : "bad"}">${esc(s.health)}</td><td>${esc(s.review)}${s.checkedAt ? `<div class="ids">checked ${esc(when(s.checkedAt))}</div>` : ""}</td>
                <td class="ids">${esc(s.lastCompleteThrough ? when(s.lastCompleteThrough) : "never")}</td></tr>`).join("")}</table></div>` : `<p class="empty">No sources recorded.</p>`}
            ${incidents.length ? `<h3 class="spaced">Open incidents · stopped until resolved</h3>${list(incidents, (i) => `<b>${esc(i.sourceId)}</b> ${esc(i.kind)} <span class="ids">since ${esc(when(i.observedAt))}</span>`)}` : ""}
            <p class="sub spaced">Local tracking ${W.tracking ? "approved; saved assessments refresh this view" : "not approved: runs are not recorded"} · state revision ${esc(W.revision)}</p>
          </div>
        </section>`;
    }
  }

  // ---- diagrams (Markdy, static SVG; re-rendered when the theme flips)
  const dark = () => document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const diagrams = [];
  async function drawDiagram(el, code, fallback) {
    if (!el || !code) return;
    try {
      if (!window.Markdy) throw new Error("diagram engine missing");
      const out = await Markdy.exportDiagramAsVectorSvg(code.replaceAll("__THEME__", dark() ? "midnight" : "paper"));
      const svg = typeof out === "string" ? out : "";
      if (!svg.includes("<svg")) throw new Error("no svg produced");
      el.innerHTML = svg;
      const s = el.querySelector("svg");
      if (s && !s.getAttribute("viewBox") && s.getAttribute("width")) {
        s.setAttribute("viewBox", `0 0 ${parseFloat(s.getAttribute("width"))} ${parseFloat(s.getAttribute("height"))}`);
      }
      s && s.removeAttribute("width");
      s && s.removeAttribute("height");
    } catch (e) {
      el.innerHTML = `<p class="fallback">Diagram unavailable (${esc(e.message)}). ${fallback || ""}</p>`;
    }
  }
  const diagram = (el, code, fallback) => { if (!el || !code) return; diagrams.push([el, code, fallback]); drawDiagram(el, code, fallback); };
  const redrawDiagrams = () => diagrams.forEach(([el, code, fb]) => drawDiagram(el, code, fb));
  $("theme").addEventListener("click", redrawDiagrams);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawDiagrams);

  const D = DATA.diagrams || {};
  if (D.timeline && $("roadmap-card")) { $("roadmap-card").hidden = false; diagram($("diagram-timeline"), D.timeline, "The dates are on the Brief tab."); }
  if ($("diagram-flywheel")) diagram($("diagram-flywheel"), D.flywheel);

  // ---- history: the archive that builds up over time
  const H = DATA.history || { days: [], merged: [] };
  const sum = (o) => Object.values(o || {}).reduce((a, b) => a + b, 0);

  function line(el, pts, { unit = "" } = {}) {
    const W = widthOf(el), H2 = 110, L = 30, R = 34, T = 10, B = 20;
    if (!pts.length) { el.innerHTML = `<p class="empty">Builds up from the first run.</p>`; return; }
    const max = niceMax(Math.max(1, ...pts.map((p) => p.v)));
    const x = (i) => pts.length === 1 ? L + (W - L - R) / 2 : L + (W - L - R) * i / (pts.length - 1);
    const y = (v) => T + (H2 - T) * (1 - v / max);
    let s = svgOpen(W, H2 + B);
    for (const t of ticks(max)) {
      s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--chart-grid)"/>`;
      s += `<text class="axis-label" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    }
    if (pts.length > 1) s += `<polyline fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" points="${pts.map((p, i) => `${x(i)},${y(p.v)}`).join(" ")}"/>`;
    pts.forEach((p, i) => {
      s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--chart-1)" stroke="var(--card)" stroke-width="2"/>`;
      s += `<rect class="mark" tabindex="0" x="${x(i) - 12}" y="${T}" width="24" height="${H2 - T}" fill="transparent" data-tip="${esc(p.label)}: ${p.v}${unit}"/>`;
    });
    const last = pts[pts.length - 1];
    s += `<text class="value-label" x="${x(pts.length - 1) + 8}" y="${y(last.v) + 4}">${last.v}</text>`;
    s += `<text class="axis-label" x="${x(0)}" y="${H2 + 16}" text-anchor="${pts.length === 1 ? "middle" : "start"}">${esc(pts[0].label.slice(5))}</text>`;
    if (pts.length > 1) s += `<text class="axis-label" x="${x(pts.length - 1)}" y="${H2 + 16}" text-anchor="end">${esc(last.label.slice(5))}</text>`;
    el.innerHTML = s + "</svg>" + tableView(["day", "value"], pts.map((p) => [p.label, p.v]));
  }

  // GitHub-style year: one cell per day, merged PRs, one-hue sequential ramp.
  function heatmap(el, counts) {
    const cell = 11, gap = 2, step = cell + gap, L = 28, T = 16;
    const end = new Date(DATA.today + "T00:00:00");
    const start = new Date(end); start.setDate(start.getDate() - 364);
    while (start.getDay() !== 1) start.setDate(start.getDate() - 1);
    const days = []; for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) days.push(new Date(d));
    const weeks = Math.ceil(days.length / 7);
    const W = L + weeks * step, H3 = T + 7 * step;
    const bin = (n) => n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : n <= 6 ? 3 : 4;
    // A month not yet archived is unknown, not zero: outline only.
    const known = new Set((DATA.backfilled || []).map((m) => m.slice(0, 7)));
    const recent = new Date(end); recent.setDate(recent.getDate() - 7);
    const isKnown = (d) => known.has(ymd(d).slice(0, 7)) || d >= recent;
    let unknown = 0;
    const fills = ["var(--ramp-0)", "var(--ramp-1)", "var(--ramp-2)", "var(--ramp-3)", "var(--ramp-4)"];
    let s = `<svg width="${W}" height="${H3}" viewBox="0 0 ${W} ${H3}" role="img" class="heat">`;
    ["Mon", "Wed", "Fri"].forEach((d, i) => { s += `<text class="axis-label" x="0" y="${T + (i * 2) * step + 9}">${d}</text>`; });
    let lastMonth = -1, total = 0;
    days.forEach((d, i) => {
      const w = Math.floor(i / 7), r = i % 7, key = ymd(d), n = counts[key] || 0;
      total += n;
      if (d.getMonth() !== lastMonth && r === 0) { lastMonth = d.getMonth(); s += `<text class="axis-label" x="${L + w * step}" y="${T - 5}">${d.toLocaleDateString(undefined, { month: "short" })}</text>`; }
      const k = isKnown(d);
      if (!k) unknown++;
      s += k
        ? `<rect class="mark cell" tabindex="-1" x="${L + w * step}" y="${T + r * step}" width="${cell}" height="${cell}" rx="2" fill="${fills[bin(n)]}" data-tip="${key}: ${n} merged"/>`
        : `<rect class="mark cell" tabindex="-1" x="${L + w * step + 0.5}" y="${T + r * step + 0.5}" width="${cell - 1}" height="${cell - 1}" rx="2" fill="none" stroke="var(--chart-grid)" data-tip="${key}: not archived yet"/>`;
    });
    s += "</svg>";
    const legend = `<div class="legend"><span>${total} merged in the archived months</span>${unknown ? `<span><i style="background:none;border:1px solid var(--chart-axis)"></i>not archived yet, filling in over the next runs</span>` : ""}<span style="margin-left:auto">Less</span>${fills.map((f) => `<i style="background:${f};margin:0"></i>`).join("")}<span>More</span></div>`;
    const months = {}; Object.entries(counts).forEach(([k, v]) => { months[k.slice(0, 7)] = (months[k.slice(0, 7)] || 0) + v; });
    el.innerHTML = legend + `<div style="overflow-x:auto">${s}</div>` + tableView(["month", "merged"], Object.entries(months).sort().reverse());
  }

  if (savedRuns.length) {
    $("history").innerHTML = `<section class="card"><h3>Saved assessment history</h3><p class="sub">Historical evidence retains its original date. Newer receipts supersede earlier delivery claims.</p>${list([...savedRuns].reverse(), (r) => `<b>${esc(human(r.mode))}</b> · ${esc(savedTime(r.finishedAt || r.invokedAt))} · ${esc(r.status)}${r.report ? `<div class="ids">${link(r.report)}</div>` : ""}${list(r.coverage, (c) => `${esc(c.source)} · ${esc(c.review)}<p>${esc(c.note)}</p>`)}`)}</section>`;
  } else {
    const counts = {};
    H.merged.filter((m) => inWork(m.repo)).forEach((m) => { counts[m.day] = (counts[m.day] || 0) + 1; });
    const days = H.days;
    const pts = (f) => days.map((d) => ({ label: d.date, v: f(d) })).filter((p) => p.v != null);
    const arch = (DATA.archive || []).map((d) => `<li><a href="reports/${esc(d)}.html">${esc(d)}</a></li>`).join("");
    $("history").innerHTML = `
      <section class="card"><h3>Shipped${workLabel ? ` to ${esc(workLabel)}` : ""}, last 12 months</h3><div class="chart" id="chart-heat"></div></section>
      <section class="grid g2">
        <div class="card"><h3>Review queue (PRs waiting on you)</h3><div class="chart" id="trend-queue"></div></div>
        <div class="card"><h3>Ready tasks across repos</h3><div class="chart" id="trend-ready"></div></div>
        <div class="card"><h3>Actions per brief</h3><div class="chart" id="trend-must"></div></div>
        <div class="card"><h3>Meeting time per day (minutes)</h3><div class="chart" id="trend-meet"></div></div>
      </section>
      <section class="card"><h3>How it works</h3><div class="diagram" id="diagram-arch"></div></section>
      <section class="card"><h3>Archive · ${(DATA.archive || []).length} daily reports</h3>${arch ? `<ul class="archive">${arch}</ul>` : `<p class="empty">The first report lands here.</p>`}</section>`;
    chart($("chart-heat"), () => heatmap($("chart-heat"), counts));
    chart($("trend-queue"), () => line($("trend-queue"), pts((d) => d.review_queue), { unit: " PRs" }));
    chart($("trend-ready"), () => line($("trend-ready"), pts((d) => sum(d.ready)), { unit: " tasks" }));
    chart($("trend-must"), () => line($("trend-must"), pts((d) => d.must_do)));
    chart($("trend-meet"), () => line($("trend-meet"), pts((d) => d.meeting_minutes), { unit: " min" }));
    diagram($("diagram-arch"), D.architecture);
  }

  // ---- live: under `cos dash`, reload when a run writes new data
  // The reload keeps the tab (the hash) and the scroll position.
  const KEEP = "cos-keep-scroll";
  if (DATA.live) {
    $("live-slot").innerHTML = `<span class="live"><i></i>Live</span>`;
    let seen = null;
    setInterval(async () => {
      try {
        const v = await (await fetch("/version", { cache: "no-store" })).text();
        if (seen && v !== seen) {
          try { sessionStorage.setItem(KEEP, String(scrollY)); } catch { /* storage off */ }
          location.reload();
        }
        seen = v;
      } catch { /* dash stopped; keep the last view */ }
    }, 3000);
  }

  // KPI count-up, once per number, when its panel is first shown.
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const countUp = (root) => {
    if (still.matches) return;
    for (const el of root.querySelectorAll("[data-count]:not([data-counted]), .spark b:not([data-counted])")) {
      el.dataset.counted = "";
      const end = Number(el.textContent);
      if (!Number.isFinite(end) || end <= 0) continue;
      const t0 = performance.now(), ms = 600;
      const step = (t) => {
        const k = Math.min(1, (t - t0) / ms);
        el.textContent = String(Math.round(end * (1 - Math.pow(1 - k, 3))));
        if (k < 1) requestAnimationFrame(step);
      };
      el.textContent = "0";
      requestAnimationFrame(step);
      // Frames can stop (a hidden tab, a headless capture); the number must not.
      setTimeout(() => { el.textContent = String(end); }, ms + 50);
    }
  };
  for (const t of tabs) t.addEventListener("click", () => countUp($(t.getAttribute("aria-controls"))));

  addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    const t = tabs.find((x) => x.getAttribute("aria-controls") === (ALIAS[h] || h));
    if (t && t.getAttribute("aria-selected") !== "true") { select(t); countUp($(current())); }
  });
  const raw = location.hash ? location.hash.slice(1) : stored("cos-tab");
  const want = ALIAS[raw] || raw;
  const start = tabs.find((t) => t.getAttribute("aria-controls") === want);
  if (start && start !== tabs[0]) select(start);
  const kept = (() => { try { const v = sessionStorage.getItem(KEEP); sessionStorage.removeItem(KEEP); return v; } catch { return null; } })()
    ?? new URLSearchParams(location.search).get("y");
  scrollTo(0, Number(kept) || 0);
  countUp($(current()));
})();
</script>
</body>
</html>
